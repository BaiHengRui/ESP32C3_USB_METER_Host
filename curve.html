<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时数据曲线</title>
  <link rel="stylesheet" href="styles.css">
  <script src="./node_modules/html2canvas/dist/html2canvas.min.js"></script>
  <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="./node_modules/chartjs-plugin-zoom/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 10px;
      overflow: hidden;
      height: 100vh;
    }
    .main-container {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 10px;
      height: calc(100vh - 20px);
    }
    .chart-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    .main-chart-container {
      flex: 3;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 8px;
      min-height: 200px;
      position: relative;
      transition: box-shadow 0.3s ease;
    }
    .main-chart-container:hover {
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.06);
    }
    .overview-chart-container {
      flex: 1;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 8px;
      min-height: 100px;
      position: relative;
      border-top: 1px solid var(--border-color);
    }
    .overview-chart-container::before {
      content: '总览';
      position: absolute;
      top: 4px;
      right: 10px;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.5;
      z-index: 10;
      pointer-events: none;
    }
    .side-panel {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
    }
    .panel-section {
      margin-bottom: 15px;
    }
    .panel-section h3 {
      font-size: 14px;
      color: var(--accent-blue);
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-color);
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
    }
    .data-row .label {
      color: var(--text-secondary);
    }
    .data-row .value {
      font-family: 'Consolas', monospace;
      font-weight: 600;
    }
    .control-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .hex-display {
      font-size: 10px;
      max-height: 120px;
      overflow-y: auto;
    }
    .chart-legend-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      flex-wrap: wrap;
    }
    .legend-inline {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .zoom-status-text {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      font-family: 'Consolas', monospace;
      letter-spacing: 0.5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    .legend-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      margin: 0 15px;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- 图表区域 -->
    <div class="chart-section">
      <!-- 控制栏 -->
      <div class="card" style="margin-bottom: 0;">
        <div class="control-row">
          <label>采样间隔:</label>
          <select id="intervalSelect">
            <option value="50">50ms</option>
            <option value="100">100ms</option>
            <option value="200">200ms</option>
            <option value="500" selected>500ms</option>
            <option value="1000">1000ms</option>
          </select>
          <button id="toggleStreamBtn" class="btn btn-success">开始采集</button>
          <button id="clearDataBtn" class="btn btn-warning">清空数据</button>
          <button id="resetViewBtn" class="btn btn-info">重置视图</button>
          <button id="saveDataBtn" class="btn btn-secondary">保存数据</button>
          <button id="saveImageBtn" class="btn btn-secondary">保存曲线为PNG</button>
          <span id="statusLabel" style="margin-left: 20px; color: var(--text-secondary);">状态: 待机</span>
        </div>
      </div>

      <!-- 图例与选项 -->
      <div class="chart-legend-row">
        <div class="legend-inline">
          <span class="legend-item"><span class="legend-color" style="background:#3ddc84"></span>电压</span>
          <span class="legend-item"><span class="legend-color" style="background:#ff69b4"></span>电流</span>
          <span class="legend-item"><span class="legend-color" style="background:#ff9800"></span>功率</span>
          <span class="legend-item"><span class="legend-color" style="background:#9c27b0"></span>温度</span>
          <span class="legend-item"><span class="legend-color" style="background:#00bcd4"></span>mAh</span>
          <span class="legend-item"><span class="legend-color" style="background:#ff5722"></span>mWh</span>
        </div>
        <div class="legend-actions">
          <div class="checkbox-group">
            <input type="checkbox" id="useSystemTimeCheck">
            <label for="useSystemTimeCheck">使用系统时间</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="showTempCheck">
            <label for="showTempCheck">显示温度</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="showMahCheck">
            <label for="showMahCheck">显示 mAh</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="showMwhCheck">
            <label for="showMwhCheck">显示 mWh</label>
          </div>
          <div class="zoom-status-text" id="zoomStatusText">可视区间: 0.00 - 10.00 s</div>
        </div>
      </div>

      <!-- 主曲线 -->
      <div class="main-chart-container">
        <canvas id="mainChart"></canvas>
      </div>

      <!-- 总览曲线 -->
      <div class="overview-chart-container">
        <canvas id="overviewChart"></canvas>
      </div>
    </div>

    <!-- 侧边数据面板 -->
    <div class="side-panel">
      <!-- 实时数据 -->
      <div class="panel-section">
        <h3>实时数据</h3>
        <div class="data-row">
          <span class="label">电压:</span>
          <span class="value text-green" id="voltageLabel">0.0000 V</span>
        </div>
        <div class="data-row">
          <span class="label">电流:</span>
          <span class="value text-pink" id="currentLabel">0.0000 A</span>
        </div>
        <div class="data-row">
          <span class="label">功率:</span>
          <span class="value text-orange" id="powerLabel">0.0000 W</span>
        </div>
        <div class="data-row">
          <span class="label">温度:</span>
          <span class="value text-purple" id="tempLabel">0.00 °C</span>
        </div>
      </div>

      <!-- 累计数据 -->
      <div class="panel-section">
        <h3>累计数据</h3>
        <div class="data-row">
          <span class="label">能量:</span>
          <span class="value" id="whLabel">0.0000 Wh</span>
        </div>
        <div class="data-row">
          <span class="label">容量:</span>
          <span class="value" id="ahLabel">0.0000 Ah</span>
        </div>
        <div class="data-row">
          <span class="label">能量:</span>
          <span class="value text-cyan" id="mwhLabel">0.0000 mWh</span>
        </div>
        <div class="data-row">
          <span class="label">容量:</span>
          <span class="value text-blue" id="mahLabel">0.0000 mAh</span>
        </div>
      </div>

      <!-- 状态信息 -->
      <div class="panel-section">
        <h3>状态信息</h3>
        <div class="data-row">
          <span class="label">状态:</span>
          <span class="value" id="directionLabel">待机</span>
        </div>
        <div class="data-row">
          <span class="label">数据点:</span>
          <span class="value" id="countLabel">0</span>
        </div>
      </div>

      <!-- 原始数据 HEX -->
      <div class="panel-section">
        <h3>原始数据</h3>
        <div class="hex-display" id="hexDisplay">等待开始采集...</div>
      </div>
    </div>
  </div>

  <script>
    // 曲线窗口逻辑
    const MAX_POINTS = 500

    // 数据存储
    const dataStore = {
      timeData: [],
      systemTimeData: [],
      timeMsData: [],
      voltageData: [],
      currentData: [],
      powerData: [],
      temperatureData: [],
      energyMWhData: [],
      chargeMAhData: []
    }

    // 状态变量
    let isStreaming = false
    let streamInterval = null

    // Y轴范围管理 - 使用智能计算（基于可见窗口内的数据极值）

    // DOM 元素
    const elements = {
      intervalSelect: document.getElementById('intervalSelect'),
      toggleStreamBtn: document.getElementById('toggleStreamBtn'),
      clearDataBtn: document.getElementById('clearDataBtn'),
      resetViewBtn: document.getElementById('resetViewBtn'),
      saveDataBtn: document.getElementById('saveDataBtn'),
      saveImageBtn: document.getElementById('saveImageBtn'),
      useSystemTimeCheck: document.getElementById('useSystemTimeCheck'),
      showTempCheck: document.getElementById('showTempCheck'),
      showMahCheck: document.getElementById('showMahCheck'),
      showMwhCheck: document.getElementById('showMwhCheck'),
      zoomStatusText: document.getElementById('zoomStatusText'),
      statusLabel: document.getElementById('statusLabel'),
      voltageLabel: document.getElementById('voltageLabel'),
      currentLabel: document.getElementById('currentLabel'),
      powerLabel: document.getElementById('powerLabel'),
      tempLabel: document.getElementById('tempLabel'),
      whLabel: document.getElementById('whLabel'),
      ahLabel: document.getElementById('ahLabel'),
      mwhLabel: document.getElementById('mwhLabel'),
      mahLabel: document.getElementById('mahLabel'),
      directionLabel: document.getElementById('directionLabel'),
      countLabel: document.getElementById('countLabel'),
      hexDisplay: document.getElementById('hexDisplay')
    }

    // 图表配置 - 实心数据点
    const chartConfig = {
      voltage: { color: '#00FF00', label: '电压 (V)' },
      current: { color: '#FF6699', label: '电流 (A)' },
      power: { color: '#E09900', label: '功率 (W)' },
      temperature: { color: '#9932CC', label: '温度 (°C)' },
      chargeMAh: { color: '#00BFFF', label: 'mAh' },
      energyMWh: { color: '#FF6347', label: 'mWh' }
    }

    // 交叉准星插件
    const crosshairPlugin = {
      id: 'crosshairPlugin',
      afterDraw(chart, args, options) {
        const active = chart.getActiveElements()
        if (!active || active.length === 0) {
          return
        }

        const ctx = chart.ctx
        const { chartArea } = chart
        const point = active[0].element
        if (!point) {
          return
        }

        const x = point.x
        const y = point.y

        ctx.save()
        ctx.strokeStyle = options.color || 'rgba(255, 255, 255, 0.45)'
        ctx.lineWidth = options.lineWidth || 1
        ctx.setLineDash(options.dash || [4, 4])
        ctx.globalAlpha = options.alpha || 0.5

        ctx.beginPath()
        ctx.moveTo(x, chartArea.top)
        ctx.lineTo(x, chartArea.bottom)
        ctx.moveTo(chartArea.left, y)
        ctx.lineTo(chartArea.right, y)
        ctx.stroke()
        ctx.restore()
      }
    }

    let userZoomed = false
    let userZoomedY = false
    // 用户设定的时间窗口大小（秒），滚轮控制此值
    let selectionWindowSize = 10

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max)
    }

    function getTimeDataSource() {
      if (elements.useSystemTimeCheck.checked && dataStore.systemTimeData.length > 0) {
        const startTime = dataStore.systemTimeData[0]
        return dataStore.systemTimeData.map(t => t - startTime)
      }
      return dataStore.timeData
    }

    /**
     * 获取指定时间范围内的数据子集
     */
    function getDataInRange(timeData, valueData, minTime, maxTime) {
      const result = []
      for (let i = 0; i < timeData.length; i++) {
        if (timeData[i] >= minTime && timeData[i] <= maxTime) {
          result.push(valueData[i])
        }
      }
      return result
    }

    /**
     * 智能计算Y轴范围 - 使用可见窗口内的数据极值，并添加合理的边距
     */
    function calcSmartYRange(dataArray, paddingRatio = 0.08) {
      if (!dataArray || dataArray.length === 0) return { min: -1, max: 1 }
      const valid = dataArray.filter(v => Number.isFinite(v))
      if (valid.length === 0) return { min: -1, max: 1 }
      const dataMin = Math.min(...valid)
      const dataMax = Math.max(...valid)
      const range = dataMax - dataMin
      if (range < 1e-10) {
        // 数据几乎无变化时，保持一个合理的显示范围
        const center = (dataMax + dataMin) / 2
        return { min: center - 0.5, max: center + 0.5 }
      }
      const padding = range * paddingRatio
      let newMin = dataMin - padding
      let newMax = dataMax + padding
      // 确保不会低于0（对于正数数据）
      if (dataMin >= 0) newMin = Math.max(0, dataMin - padding * 0.5)
      if (dataMax >= 0 && newMax < 0) newMax = dataMax + padding
      return { min: newMin, max: newMax }
    }

    /**
     * 智能更新Y轴范围 - 基于可视区间内所有数据点计算
     */
    function updateYAxisRangesSmart() {
      const xScale = mainChart.scales.x
      if (!xScale) return
      const viewMin = Number.isFinite(xScale.min) ? xScale.min : 0
      const viewMax = Number.isFinite(xScale.max) ? xScale.max : 10
      const timeData = getTimeDataSource()

      // 获取可见窗口内的数据
      const vVoltage = getDataInRange(timeData, dataStore.voltageData, viewMin, viewMax)
      const vCurrent = getDataInRange(timeData, dataStore.currentData, viewMin, viewMax)
      const vPower = getDataInRange(timeData, dataStore.powerData, viewMin, viewMax)

      // 电压轴
      const vRange = calcSmartYRange(vVoltage, 0.05)
      mainChart.options.scales.y.min = vRange.min
      mainChart.options.scales.y.max = vRange.max

      // 电流轴
      const cRange = calcSmartYRange(vCurrent, 0.08)
      mainChart.options.scales.y1.min = cRange.min
      mainChart.options.scales.y1.max = cRange.max

      // 功率轴
      const pRange = calcSmartYRange(vPower, 0.08)
      mainChart.options.scales.y2.min = pRange.min
      mainChart.options.scales.y2.max = pRange.max
    }

    /**
     * 更新数据密度和曲线平滑度
     */
    function updateTensionAndPointStyle() {
      const totalPoints = dataStore.timeData.length
      if (totalPoints <= 0) return

      const xScale = mainChart.scales.x
      const viewMin = Number.isFinite(xScale?.min) ? xScale.min : 0
      const viewMax = Number.isFinite(xScale?.max) ? xScale.max : 10
      const viewRange = Math.max(0.1, viewMax - viewMin)

      // 计算可见区域的数据密度（点/秒）
      const timeData = getTimeDataSource()
      const visiblePoints = timeData.filter(t => t >= viewMin && t <= viewMax).length
      const density = visiblePoints / viewRange

      // 根据密度调整 tension（平滑度）
      let tension
      if (density > 50) {
        tension = 0.3    // 高密度：更平滑
      } else if (density > 20) {
        tension = 0.2
      } else if (density > 5) {
        tension = 0.15
      } else {
        tension = 0.05    // 低密度：更贴近原始数据
      }

      // 根据密度决定是否显示数据点
      const showPoints = density <= 8 && visiblePoints <= 80
      const pointRadius = showPoints ? 2 : 0
      const pointHoverRadius = showPoints ? 5 : 3

      mainChart.data.datasets.forEach(ds => {
        ds.tension = tension
        ds.pointRadius = pointRadius
        ds.pointHoverRadius = pointHoverRadius
        ds.borderWidth = density > 100 ? 1.5 : 2
      })
    }

    function rebuildChartData() {
      const timeData = getTimeDataSource()
      const voltagePoints = timeData.map((x, idx) => ({ x, y: dataStore.voltageData[idx] }))
      const currentPoints = timeData.map((x, idx) => ({ x, y: dataStore.currentData[idx] }))
      const powerPoints = timeData.map((x, idx) => ({ x, y: dataStore.powerData[idx] }))
      const temperaturePoints = timeData.map((x, idx) => ({ x, y: dataStore.temperatureData[idx] }))
      const chargeMAhPoints = timeData.map((x, idx) => ({ x, y: dataStore.chargeMAhData[idx] }))
      const energyMWhPoints = timeData.map((x, idx) => ({ x, y: dataStore.energyMWhData[idx] }))

      mainChart.data.datasets[0].data = voltagePoints
      mainChart.data.datasets[1].data = currentPoints
      mainChart.data.datasets[2].data = powerPoints
      mainChart.data.datasets[3].data = temperaturePoints
      mainChart.data.datasets[4].data = chargeMAhPoints
      mainChart.data.datasets[5].data = energyMWhPoints

      overviewChart.data.datasets[0].data = voltagePoints
      overviewChart.data.datasets[1].data = currentPoints
      overviewChart.data.datasets[2].data = powerPoints

      const latestTime = timeData[timeData.length - 1] || 0
      const dataMin = timeData[0] || 0
      const totalDataRange = Math.max(1, latestTime - dataMin)

      if (!userZoomed) {
        // 未缩放模式：用当前窗口大小自动滚动显示最新数据
        const windowSize = Math.min(selectionWindowSize, Math.max(10, totalDataRange))
        selectionWindowSize = windowSize

        if (latestTime <= windowSize) {
          mainChart.options.scales.x.min = 0
          mainChart.options.scales.x.max = Math.max(windowSize, latestTime || windowSize)
        } else {
          mainChart.options.scales.x.min = latestTime - windowSize
          mainChart.options.scales.x.max = latestTime
        }
      } else {
        // 用户已手动调整过窗口
        const currentMin = mainChart.options.scales.x.min
        const currentMax = mainChart.options.scales.x.max
        const rightGap = latestTime - currentMax  // 新数据到窗口右侧的距离

        // 如果用户窗口右侧紧贴数据末尾（用户在查看最新），新数据到来时自动右移
        if (latestTime > currentMax && rightGap < selectionWindowSize * 0.05) {
          const shift = latestTime - currentMax
          mainChart.options.scales.x.min = currentMin + shift
          mainChart.options.scales.x.max = latestTime
        }
        // 如果窗口比总数据范围还大，缩到总数据大小
        if (selectionWindowSize > totalDataRange) {
          selectionWindowSize = totalDataRange
          mainChart.options.scales.x.min = dataMin
          mainChart.options.scales.x.max = latestTime
        }
      }

      overviewChart.options.scales.x.min = 0
      overviewChart.options.scales.x.max = Math.max(latestTime || 10, 10)

      // 智能更新Y轴范围（仅在非手动缩放Y轴时）
      if (!userZoomedY) {
        updateYAxisRangesSmart()
      }

      // 更新曲线平滑度和点样式
      updateTensionAndPointStyle()

      mainChart.update('none')
      overviewChart.update('none')
      updateZoomStatus()
    }

    function updateZoomStatus() {
      const scale = mainChart.scales?.x
      const hasData = mainChart.data.datasets.some(d => Array.isArray(d.data) && d.data.length > 0)
      if (!hasData || !scale) {
        elements.zoomStatusText.textContent = '窗口: 10.00 s | 无数据'
        return
      }

      const viewMin = Number.isFinite(scale.min) ? scale.min : 0
      const viewMax = Number.isFinite(scale.max) ? scale.max : 10
      const viewWindow = Math.max(0.01, viewMax - viewMin)
      const dataRange = dataStore.timeData.length > 1
        ? Math.max(0.1, dataStore.timeData[dataStore.timeData.length - 1] - dataStore.timeData[0])
        : 0

      const isFull = dataRange > 0 && viewWindow >= dataRange * 0.97
      elements.zoomStatusText.textContent =
        `窗口: ${viewWindow.toFixed(2)} s | 范围: ${viewMin.toFixed(1)} ~ ${viewMax.toFixed(1)} s${isFull ? ' [全览]' : ''}`
    }

    function chartHasData(chart) {
      return chart.data.datasets.some(dataset => Array.isArray(dataset.data) && dataset.data.length > 0)
    }

    /**
     * 滚轮控制纵览图中的半透明窗口大小
     * 向下滚 → 放大窗口（看更长时间范围）
     * 向上滚 → 缩小窗口（看更短时间范围，更精细）
     * 窗口以鼠标位置为中心缩放，最小1秒，最大为全部数据范围
     */
    function zoomTimeAxis(chart, deltaY, clientX) {
      if (!chartHasData(chart)) return

      // 获取当前数据范围，作为最大窗口限制
      const timeData = getTimeDataSource()
      const dataMin = timeData.length > 0 ? timeData[0] : 0
      const dataMax = timeData.length > 0 ? timeData[timeData.length - 1] : 10
      const totalRange = Math.max(1, dataMax - dataMin)

      const xScale = chart.scales.x
      if (!xScale) return

      // 计算当前窗口中心位置（以鼠标位置为中心，或当前视图中心）
      const rect = chart.canvas.getBoundingClientRect()
      const mouseX = clientX - rect.left
      const valueAtPointer = xScale.getValueForPixel(mouseX)
      const viewCenter = (valueAtPointer !== undefined && valueAtPointer !== null)
        ? valueAtPointer
        : (Number.isFinite(xScale.min) ? xScale.min : 0) + selectionWindowSize / 2

      // 平滑调整窗口大小
      const speedFactor = Math.min(Math.abs(deltaY) / 100, 3)
      const resizeFactor = deltaY > 0
        ? 1 + 0.1 * speedFactor   // 向下滚 → 放大窗口
        : 1 / (1 + 0.1 * speedFactor) // 向上滚 → 缩小窗口

      const newSize = selectionWindowSize * resizeFactor

      // 约束到 [1秒, 总数据范围]
      const minWindow = 1
      const maxWindow = Math.max(minWindow, totalRange)
      selectionWindowSize = clamp(newSize, minWindow, maxWindow)

      // 根据窗口大小和中心位置计算新的X轴范围
      let newMin = viewCenter - selectionWindowSize / 2
      let newMax = viewCenter + selectionWindowSize / 2

      // 边界约束：不能超出数据范围
      if (selectionWindowSize >= totalRange * 0.97) {
        // 窗口接近或等于总览大小，直接显示全部数据
        newMin = dataMin
        newMax = dataMax
        selectionWindowSize = totalRange  // 修正为实际总览大小
      } else {
        if (newMin < dataMin) {
          newMin = dataMin
          newMax = dataMin + selectionWindowSize
        }
        if (newMax > dataMax) {
          newMax = dataMax
          newMin = dataMax - selectionWindowSize
        }
      }

      chart.options.scales.x.min = newMin
      chart.options.scales.x.max = newMax
      chart.update('none')
      userZoomed = true
      userZoomedY = false
    }

    /**
     * 鼠标拖拽平移功能
     */
    function registerDragPan(chart) {
      let isDragging = false
      let startX = 0
      let startMin = 0
      let startMax = 0

      chart.canvas.addEventListener('mousedown', (evt) => {
        if (evt.button !== 0) return // 只响应左键
        // 检查是否在图表区域内
        const rect = chart.canvas.getBoundingClientRect()
        if (evt.clientX < rect.left || evt.clientX > rect.right) return

        isDragging = true
        startX = evt.clientX
        const scale = chart.scales.x
        if (scale) {
          startMin = Number.isFinite(scale.min) ? scale.min : 0
          startMax = Number.isFinite(scale.max) ? scale.max : 10
        }
        chart.canvas.style.cursor = 'grabbing'
      })

      document.addEventListener('mousemove', (evt) => {
        if (!isDragging) return
        evt.preventDefault()

        const scale = chart.scales.x
        if (!scale) return

        const rect = chart.canvas.getBoundingClientRect()
        const pixelsPerUnit = (rect.right - rect.left) / (startMax - startMin)
        const dx = (evt.clientX - startX) / pixelsPerUnit

        const dataMin = dataStore.timeData.length > 0 ? dataStore.timeData[0] : 0
        const dataMax = dataStore.timeData.length > 0 ? dataStore.timeData[dataStore.timeData.length - 1] : 10
        const range = startMax - startMin

        let newMin = startMin - dx
        let newMax = startMax - dx

        // 边界约束
        if (newMin < dataMin) {
          newMin = dataMin
          newMax = dataMin + range
        }
        if (newMax > dataMax) {
          newMax = dataMax
          newMin = dataMax - range
        }

        chart.options.scales.x.min = newMin
        chart.options.scales.x.max = newMax
        chart.update('none')
        userZoomed = true
        updateZoomStatus()
      })

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false
          chart.canvas.style.cursor = ''
          overviewChart.update('none')  // 刷新纵览图的选择窗口
        }
      })
    }

    /**
     * 滚轮缩放：缩放主图后，刷新纵览图的选择窗口显示
     */
    function registerWheelZoom(chart) {
      let wheelTimeout = null
      chart.canvas.addEventListener('wheel', (evt) => {
        if (!chartHasData(chart)) {
          evt.preventDefault()
          return
        }
        evt.preventDefault()

        zoomTimeAxis(chart, evt.deltaY, evt.clientX)

        // 节流刷新纵览图的选择窗口
        if (wheelTimeout) clearTimeout(wheelTimeout)
        wheelTimeout = setTimeout(() => {
          overviewChart.update('none')
          wheelTimeout = null
        }, 50)
      }, { passive: false })
    }

    /**
     * 双击重置缩放
     */
    function registerDblClickReset(chart) {
      chart.canvas.addEventListener('dblclick', () => {
        userZoomed = false
        userZoomedY = false
        selectionWindowSize = 10
        const dataMax = dataStore.timeData.length > 0
          ? dataStore.timeData[dataStore.timeData.length - 1]
          : 10
        const windowSize = Math.max(10, dataMax)
        if (dataMax <= windowSize) {
          chart.options.scales.x.min = 0
          chart.options.scales.x.max = Math.max(windowSize, dataMax)
        } else {
          chart.options.scales.x.min = dataMax - windowSize
          chart.options.scales.x.max = dataMax
        }
        chart.update('none')
        overviewChart.update('none')
        updateZoomStatus()
      })
    }

        if (!xScale) return

        // 获取点击位置对应的时间值
        const clickValue = xScale.getValueForPixel(mouseX)
        if (clickValue === undefined || clickValue === null) return

        // 使用当前窗口大小，以点击位置为中心重新定位
        const dataMin = dataStore.timeData.length > 0 ? dataStore.timeData[0] : 0
        const dataMax = dataStore.timeData.length > 0 ? dataStore.timeData[dataStore.timeData.length - 1] : 10

        let newMin = clickValue - selectionWindowSize / 2
        let newMax = clickValue + selectionWindowSize / 2

        // 边界约束
        const totalRange = Math.max(1, dataMax - dataMin)
        if (selectionWindowSize >= totalRange * 0.97) {
          newMin = dataMin
          newMax = dataMax
        } else {
          if (newMin < dataMin) { newMin = dataMin; newMax = dataMin + selectionWindowSize }
          if (newMax > dataMax) { newMax = dataMax; newMin = dataMax - selectionWindowSize }
        }

        mainChart.options.scales.x.min = newMin
        mainChart.options.scales.x.max = newMax
        mainChart.update('none')
        overviewChart.update('none')
        userZoomed = true
        updateZoomStatus()
      })

    const overviewSelectionPlugin = {
      id: 'overviewSelectionPlugin',
      afterDraw(chart) {
        const mainScale = mainChart.scales.x
        const overviewScale = chart.scales.x
        if (!mainScale || !overviewScale || mainScale.min == null || mainScale.max == null) {
          return
        }

        const ctx = chart.ctx
        const left = overviewScale.getPixelForValue(mainScale.min)
        const right = overviewScale.getPixelForValue(mainScale.max)
        const top = chart.chartArea.top
        const bottom = chart.chartArea.bottom

        if (left === undefined || right === undefined || isNaN(left) || isNaN(right)) return

        ctx.save()

        // 非选中区域（左右两侧）加暗色遮罩
        ctx.fillStyle = 'rgba(0, 0, 0, 0.30)'
        if (left > chart.chartArea.left) {
          ctx.fillRect(chart.chartArea.left, top, left - chart.chartArea.left, bottom - top)
        }
        if (right < chart.chartArea.right) {
          ctx.fillRect(right, top, chart.chartArea.right - right, bottom - top)
        }

        // 选中区域的高亮填充（半透明蓝色渐变）
        const gradient = ctx.createLinearGradient(left, top, right, top)
        gradient.addColorStop(0, 'rgba(0, 217, 255, 0.15)')
        gradient.addColorStop(0.5, 'rgba(0, 217, 255, 0.06)')
        gradient.addColorStop(1, 'rgba(0, 217, 255, 0.15)')
        ctx.fillStyle = gradient
        ctx.fillRect(left, top, right - left, bottom - top)

        // 选中区域的左右边框（实线更清晰）
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.60)'
        ctx.lineWidth = 2
        ctx.beginPath()
        ctx.moveTo(left, top)
        ctx.lineTo(left, bottom)
        ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(right, top)
        ctx.lineTo(right, bottom)
        ctx.stroke()

        // 顶部和底部的横线（让窗口更明显）
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.25)'
        ctx.lineWidth = 1
        ctx.setLineDash([3, 3])
        ctx.beginPath()
        ctx.moveTo(left, top)
        ctx.lineTo(right, top)
        ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(left, bottom)
        ctx.lineTo(right, bottom)
        ctx.stroke()
        ctx.setLineDash([])

        // 左右两侧的拖拽手柄
        ctx.fillStyle = 'rgba(0, 217, 255, 0.70)'
        const hw = 4, hh = 8
        ctx.fillRect(left - hw, (top + bottom) / 2 - hh, hw * 2, hh * 2)
        ctx.fillRect(right - hw, (top + bottom) / 2 - hh, hw * 2, hh * 2)

        ctx.restore()
      }

        try {
          await window.electronAPI.requestData()
        } catch (err) {
          console.error('请求数据失败:', err)
        }
      }, interval)

      const defaultName = `curve_data_${now.getFullYear()}${(now.getMonth() + 1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}${now.getSeconds().toString().padStart(2, '0')}.csv`

      const result = await window.electronAPI.saveDialog(defaultName, [
        { name: 'CSV Files', extensions: ['csv'] },
        { name: 'All Files', extensions: ['*'] }
      ])

      if (result.filePath) {
        let csv = '序号,时间(秒),时间戳(ms),电压(V),电流(A),功率(W),温度(°C),能量(mWh),容量(mAh)\n'

        for (let i = 0; i < dataStore.timeData.length; i++) {
          csv += `${i + 1},${dataStore.timeData[i].toFixed(3)},${dataStore.timeMsData[i]},`
          csv += `${dataStore.voltageData[i].toFixed(4)},${dataStore.currentData[i].toFixed(4)},${dataStore.powerData[i].toFixed(4)},`
          csv += `${dataStore.temperatureData[i].toFixed(2)},${dataStore.energyMWhData[i].toFixed(4)},${dataStore.chargeMAhData[i].toFixed(4)}\n`
        }

        const saveResult = await window.electronAPI.saveLogFile(result.filePath, '\ufeff' + csv)
        if (saveResult.success) {
          alert(`数据已保存至:\n${result.filePath}`)
        } else {
          alert(`保存失败: ${saveResult.error}`)
        }
      }
    }

    // 保存整个界面为 PNG 图片
    async function saveChartAsImage() {
      try {
        // 使用 html2canvas 捕获整个页面
        const canvas = await html2canvas(document.body, {
          backgroundColor: '#0f0f1a',
          scale: 2,
          logging: false,
          useCORS: true
        })

        // 转换为数据 URL
        const dataUrl = canvas.toDataURL('image/png')

        // 打开保存对话框
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)
        const result = await window.electronAPI.saveImageDialog(`curve_${timestamp}.png`)

        if (!result.canceled && result.filePath) {
          const saveResult = await window.electronAPI.saveImageFile(result.filePath, dataUrl)
          if (saveResult.success) {
            alert(`曲线图片已保存至:\n${result.filePath}`)
          } else {
            alert(`保存失败: ${saveResult.error}`)
          }
        }
      } catch (err) {
        alert(`保存失败: ${err.message}`)
      }
    }

    // 切换曲线显示
    function toggleDataset(index, visible) {
      mainChart.data.datasets[index].hidden = !visible

      const yAxisMap = { 3: 'y3', 4: 'y4', 5: 'y5' }
      if (yAxisMap[index]) {
        mainChart.options.scales[yAxisMap[index]].display = visible
      }

      mainChart.update('none')
    }

    // 设置事件监听
    elements.toggleStreamBtn.addEventListener('click', toggleStream)
    elements.clearDataBtn.addEventListener('click', clearData)
    elements.resetViewBtn.addEventListener('click', resetView)
    elements.saveDataBtn.addEventListener('click', saveData)
    elements.saveImageBtn.addEventListener('click', saveChartAsImage)

    elements.showTempCheck.addEventListener('change', (e) => toggleDataset(3, e.target.checked))
    elements.showMahCheck.addEventListener('change', (e) => toggleDataset(4, e.target.checked))
    elements.showMwhCheck.addEventListener('change', (e) => toggleDataset(5, e.target.checked))
    elements.useSystemTimeCheck.addEventListener('change', () => {
      userZoomed = false
      rebuildChartData()
    })

    // 监听电表数据
    window.electronAPI.onMeterData((data) => {
      if (isStreaming) {
        updateCharts(data)
        updateHexDisplay(data)
      }
    })

    // 监听菜单事件
    window.electronAPI.onMenuSaveImage(() => {
      saveChartAsImage()
    })

    window.electronAPI.onMenuSaveData(() => {
      saveData()
    })

    window.electronAPI.onMenuResetView(() => {
      resetView()
    })

    // 初始化主题
    async function initTheme() {
      const theme = await window.electronAPI.getTheme()
      applyTheme(theme)
    }

    function applyTheme(theme) {
      document.body.classList.remove('theme-light', 'theme-dark')
      document.body.classList.add(`theme-${theme}`)
    }

    // 监听主题变化
    window.electronAPI.onThemeChanged((theme) => {
      applyTheme(theme)
    })

    // 启动时初始化主题
    initTheme()
  </script>
</body>
</html>
