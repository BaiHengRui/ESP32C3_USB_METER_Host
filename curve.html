<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时数据曲线</title>
  <link rel="stylesheet" href="styles.css">
  <script src="./node_modules/html2canvas/dist/html2canvas.min.js"></script>
  <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="./node_modules/chartjs-plugin-zoom/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 10px;
      overflow: hidden;
      height: 100vh;
    }
    .main-container {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 10px;
      height: calc(100vh - 20px);
    }
    .chart-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    .main-chart-container {
      flex: 3;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 8px;
      min-height: 200px;
      position: relative;
      transition: box-shadow 0.3s ease;
    }
    .main-chart-container:hover {
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.06);
    }
    .overview-chart-container {
      flex: 1;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 8px;
      min-height: 100px;
      position: relative;
      border-top: 1px solid var(--border-color);
    }
    .overview-chart-container::before {
      content: '总览';
      position: absolute;
      top: 4px;
      right: 10px;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.5;
      z-index: 10;
      pointer-events: none;
    }
    .side-panel {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
    }
    .panel-section {
      margin-bottom: 15px;
    }
    .panel-section h3 {
      font-size: 14px;
      color: var(--accent-blue);
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-color);
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
    }
    .data-row .label {
      color: var(--text-secondary);
    }
    .data-row .value {
      font-family: 'Consolas', monospace;
      font-weight: 600;
    }
    .control-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .hex-display {
      font-size: 10px;
      max-height: 120px;
      overflow-y: auto;
    }
    .chart-legend-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      flex-wrap: wrap;
    }
    .legend-inline {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .zoom-status-text {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      font-family: 'Consolas', monospace;
      letter-spacing: 0.5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    .legend-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      margin: 0 15px;
    }
    canvas {
      max-width: 100%;
    }
    .hint-text {
      font-size: 10px;
      color: var(--text-secondary);
      opacity: 0.6;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- 图表区域 -->
    <div class="chart-section">
      <!-- 控制栏 -->
      <div class="card" style="margin-bottom: 0;">
        <div class="control-row">
          <label>采样间隔:</label>
          <select id="intervalSelect">
            <option value="50">50ms</option>
            <option value="100">100ms</option>
            <option value="200">200ms</option>
            <option value="500" selected>500ms</option>
            <option value="1000">1000ms</option>
          </select>
          <label style="margin-left:12px;">存储深度:</label>
          <select id="depthSelect">
            <option value="5">5 MB</option>
            <option value="10">10 MB</option>
            <option value="20" selected>20 MB</option>
            <option value="50">50 MB</option>
            <option value="100">100 MB</option>
            <option value="200">200 MB</option>
          </select>
          <span id="depthHint" style="font-size:11px;color:var(--text-secondary);margin-left:4px;"></span>
          <button id="toggleStreamBtn" class="btn btn-success">开始采集</button>
          <button id="clearDataBtn" class="btn btn-warning">清空数据</button>
          <button id="resetViewBtn" class="btn btn-info">重置视图</button>
          <button id="saveDataBtn" class="btn btn-secondary">保存数据</button>
          <button id="saveImageBtn" class="btn btn-secondary">保存曲线为PNG</button>
          <span id="statusLabel" style="margin-left: 20px; color: var(--text-secondary);">状态: 待机</span>
        </div>
      </div>

      <!-- 图例与选项 -->
      <div class="chart-legend-row">
        <div class="legend-inline">
          <span class="legend-item"><span class="legend-color" style="background:#3ddc84"></span>电压</span>
          <span class="legend-item"><span class="legend-color" style="background:#ff69b4"></span>电流</span>
          <span class="legend-item"><span class="legend-color" style="background:#ff9800"></span>功率</span>
          <span class="legend-item"><span class="legend-color" style="background:#9c27b0"></span>温度</span>
          <span class="legend-item"><span class="legend-color" style="background:#00bcd4"></span>mAh</span>
          <span class="legend-item"><span class="legend-color" style="background:#ff5722"></span>mWh</span>
        </div>
        <div class="legend-actions">
          <div class="checkbox-group">
            <input type="checkbox" id="useSystemTimeCheck">
            <label for="useSystemTimeCheck">使用系统时间</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="showTempCheck">
            <label for="showTempCheck">显示温度</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="showMahCheck">
            <label for="showMahCheck">显示 mAh</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="showMwhCheck">
            <label for="showMwhCheck">显示 mWh</label>
          </div>
          <button id="autoFollowBtn" class="btn btn-info" style="font-size:11px;padding:3px 8px;">自动跟随 ✓</button>
          <!-- <span class="hint-text">滚轮缩放 · 拖拽平移 · Shift+拖拽框选 · 双击/右键重置 · 拖动总览框定位</span> -->
          <div class="zoom-status-text" id="zoomStatusText">可视区间: 0.00 - 10.00 s</div>
        </div>
      </div>

      <!-- 主曲线 -->
      <div class="main-chart-container">
        <canvas id="mainChart"></canvas>
      </div>

      <!-- 总览曲线 -->
      <div class="overview-chart-container">
        <canvas id="overviewChart"></canvas>
      </div>
    </div>

    <!-- 侧边数据面板 -->
    <div class="side-panel">
      <!-- 实时数据 -->
      <div class="panel-section">
        <h3>实时数据</h3>
        <div class="data-row">
          <span class="label">电压:</span>
          <span class="value text-green" id="voltageLabel">0.0000 V</span>
        </div>
        <div class="data-row">
          <span class="label">电流:</span>
          <span class="value text-pink" id="currentLabel">0.0000 A</span>
        </div>
        <div class="data-row">
          <span class="label">功率:</span>
          <span class="value text-orange" id="powerLabel">0.0000 W</span>
        </div>
        <div class="data-row">
          <span class="label">ADC温度:</span>
          <span class="value text-purple" id="tempLabel">0.00 °C</span>
        </div>
        <div class="data-row">
          <span class="label">CPU温度:</span>
          <span class="value text-secondary" id="cpuTempLabel">0.00 °C</span>
        </div>
      </div>

      <!-- 累计数据 -->
      <div class="panel-section">
        <h3>累计数据</h3>
        <div class="data-row">
          <span class="label">能量:</span>
          <span class="value" id="whLabel">0.0000 Wh</span>
        </div>
        <div class="data-row">
          <span class="label">容量:</span>
          <span class="value" id="ahLabel">0.0000 Ah</span>
        </div>
        <div class="data-row">
          <span class="label">能量:</span>
          <span class="value text-cyan" id="mwhLabel">0.0000 mWh</span>
        </div>
        <div class="data-row">
          <span class="label">容量:</span>
          <span class="value text-blue" id="mahLabel">0.0000 mAh</span>
        </div>
      </div>

      <!-- 状态信息 -->
      <div class="panel-section">
        <h3>状态信息</h3>
        <div class="data-row">
          <span class="label">状态:</span>
          <span class="value" id="directionLabel">待机</span>
        </div>
        <div class="data-row">
          <span class="label">数据点:</span>
          <span class="value" id="countLabel">0</span>
        </div>
      </div>

      <!-- 原始数据 HEX -->
      <div class="panel-section">
        <h3>原始数据</h3>
        <div class="hex-display" id="hexDisplay">NULL</div>
      </div>
    </div>
  </div>

  <script>
    // 曲线窗口逻辑

    // 设置 Chart.js 全局中文字体，否则 Canvas 渲染中文会显示为方块或空白
    Chart.defaults.font.family = "'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"

    const POINTS_PER_MB = Math.floor(1024 * 1024 / 72)  // ≈14563 点/MB（每点约72字节）
    let MAX_POINTS = 20 * POINTS_PER_MB                    // 默认 20 MB

    // 数据存储（L1：全局原始数据池，唯一真值）
    const dataStore = {
      timeData: [],
      systemTimeData: [],
      espTimeUsData: [],
      voltageData: [],
      currentData: [],
      powerData: [],
      temperatureData: [],
      temperatureCpuData: [],
      energyMWhData: [],
      chargeMAhData: []
    }

    // L2：双视图独立抽稀缓存（渲染专用，不修改原始数据）
    const overviewCache = { time: [], voltage: [], current: [], power: [] }
    const mainCache = { time: [], voltage: [], current: [], power: [], temperature: [], chargeMAh: [], energyMWh: [] }

    // ========== 像素级极值抽稀（Min-Max per Pixel Bin） ==========
    /**
     * 将原始数据按目标像素宽度做极值分桶抽稀
     * @param {number[]} timeArr - 时间数组
     * @param {number[]} valArr - 数值数组
     * @param {number} xMin - 可视区间左边界
     * @param {number} xMax - 可视区间右边界
     * @param {number} pixelWidth - 目标画布像素宽度
     * @returns {{x:number, yMin:number, yMax:number}[]} 每个像素桶的极值对
     */
    function decimateMinMax(timeArr, valArr, xMin, xMax, pixelWidth) {
      if (!timeArr || timeArr.length === 0) return []
      const range = Math.max(0.001, xMax - xMin)
      const binCount = Math.max(1, Math.min(pixelWidth, 2000))
      const binWidth = range / binCount
      const bins = new Array(binCount)
      for (let i = 0; i < binCount; i++) {
        bins[i] = { x: xMin + (i + 0.5) * binWidth, min: Infinity, max: -Infinity, count: 0 }
      }

      // 单次遍历分桶
      for (let i = 0; i < timeArr.length; i++) {
        const t = timeArr[i]
        if (t < xMin || t > xMax) continue
        const v = valArr[i]
        if (!Number.isFinite(v)) continue
        const binIdx = Math.min(binCount - 1, Math.floor((t - xMin) / binWidth))
        if (bins[binIdx].min > v) bins[binIdx].min = v
        if (bins[binIdx].max < v) bins[binIdx].max = v
        bins[binIdx].count++
      }

      // 输出有效桶
      const result = []
      for (const b of bins) {
        if (b.count > 0) {
          result.push({ x: b.x, yMin: b.min, yMax: b.max })
        }
      }
      return result
    }

    /**
     * 重建总览抽稀缓存（对全量原始数据做粗粒度极值抽稀）
     */
    function rebuildOverviewCache() {
      const timeData = getTimeDataSource()
      const totalTime = timeData.length > 0 ? timeData[timeData.length - 1] : 0
      const pixelW = Math.max(200, (overviewChart.canvas?.clientWidth || 500))

      const vDec = decimateMinMax(timeData, dataStore.voltageData, 0, Math.max(totalTime, 1), pixelW)
      const cDec = decimateMinMax(timeData, dataStore.currentData, 0, Math.max(totalTime, 1), pixelW)
      const pDec = decimateMinMax(timeData, dataStore.powerData,  0, Math.max(totalTime, 1), pixelW)

      overviewCache.time = vDec.map(d => d.x)
      overviewCache.voltage = vDec
      overviewCache.current = cDec
      overviewCache.power = pDec
    }

    // 将每桶 {x, yMin, yMax} 展开为 min/max 两个点（同一 x 坐标构成垂直尖峰），桶内无波动时仅输出一点
    function expandMinMax(dec) {
      const out = []
      for (const d of dec) {
        out.push({ x: d.x, y: d.yMin })
        if (d.yMax !== d.yMin) out.push({ x: d.x, y: d.yMax })
      }
      return out
    }

    // 状态变量
    let isStreaming = false
    let streamInterval = null
    let autoFollow = true       // 录制时是否自动跟随最新数据（用户缩放/平移/框选后自动关闭）
    let userInteracted = false  // 用户是否手动操作过视图
    let recordingStartUs = null // 录制起始时间戳（us），用于计算相对时间，保证X轴始终从0开始
    let followWindowSize = 10   // 自动跟随时的窗口宽度（秒），滚轮缩放/框选时同步更新

    // 缩放常量
    const ZOOM_FACTOR = 1.15
    const MIN_X_RANGE = 0.05    // 最小X区间（秒），防止缩到单点卡死
    const MIN_Y_RANGE = 0.001   // 最小Y区间

    // Y轴单向自适应量程
    const yAxisExpandedRange = {
      y: { min: undefined, max: undefined },
      y1: { min: undefined, max: undefined },
      y2: { min: undefined, max: undefined }
    }

    function resetYAxisExpandedRange() {
      yAxisExpandedRange.y = { min: undefined, max: undefined }
      yAxisExpandedRange.y1 = { min: undefined, max: undefined }
      yAxisExpandedRange.y2 = { min: undefined, max: undefined }
    }
    // DOM 元素
    const elements = {
      intervalSelect: document.getElementById('intervalSelect'),
      depthSelect: document.getElementById('depthSelect'),
      depthHint: document.getElementById('depthHint'),
      toggleStreamBtn: document.getElementById('toggleStreamBtn'),
      clearDataBtn: document.getElementById('clearDataBtn'),
      resetViewBtn: document.getElementById('resetViewBtn'),
      saveDataBtn: document.getElementById('saveDataBtn'),
      saveImageBtn: document.getElementById('saveImageBtn'),
      useSystemTimeCheck: document.getElementById('useSystemTimeCheck'),
      showTempCheck: document.getElementById('showTempCheck'),
      showMahCheck: document.getElementById('showMahCheck'),
      showMwhCheck: document.getElementById('showMwhCheck'),
      zoomStatusText: document.getElementById('zoomStatusText'),
      autoFollowBtn: document.getElementById('autoFollowBtn'),
      statusLabel: document.getElementById('statusLabel'),
      voltageLabel: document.getElementById('voltageLabel'),
      currentLabel: document.getElementById('currentLabel'),
      powerLabel: document.getElementById('powerLabel'),
      tempLabel: document.getElementById('tempLabel'),
      cpuTempLabel: document.getElementById('cpuTempLabel'),
      whLabel: document.getElementById('whLabel'),
      ahLabel: document.getElementById('ahLabel'),
      mwhLabel: document.getElementById('mwhLabel'),
      mahLabel: document.getElementById('mahLabel'),
      directionLabel: document.getElementById('directionLabel'),
      countLabel: document.getElementById('countLabel'),
      hexDisplay: document.getElementById('hexDisplay')
    }

    // 图表配置 - 实心数据点
    const chartConfig = {
      voltage: { color: '#00FF00', label: '电压 (V)' },
      current: { color: '#FF6699', label: '电流 (A)' },
      power: { color: '#E09900', label: '功率 (W)' },
      temperature: { color: '#9932CC', label: '温度 (°C)' },
      chargeMAh: { color: '#00BFFF', label: 'mAh' },
      energyMWh: { color: '#FF6347', label: 'mWh' }
    }

    // 交叉准星插件
    const crosshairPlugin = {
      id: 'crosshairPlugin',
      afterDraw(chart, args, options) {
        const active = chart.getActiveElements()
        if (!active || active.length === 0) {
          return
        }

        const ctx = chart.ctx
        const { chartArea } = chart
        const point = active[0].element
        if (!point) {
          return
        }

        const x = point.x
        const y = point.y

        ctx.save()
        ctx.strokeStyle = options.color || 'rgba(255, 255, 255, 0.45)'
        ctx.lineWidth = options.lineWidth || 1
        ctx.setLineDash(options.dash || [4, 4])
        ctx.globalAlpha = options.alpha || 0.5

        ctx.beginPath()
        ctx.moveTo(x, chartArea.top)
        ctx.lineTo(x, chartArea.bottom)
        ctx.moveTo(chartArea.left, y)
        ctx.lineTo(chartArea.right, y)
        ctx.stroke()
        ctx.restore()
      }
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max)
    }

    function getTimeDataSource() {
      if (elements.useSystemTimeCheck.checked && dataStore.systemTimeData.length > 0) {
        const startTime = dataStore.systemTimeData[0]
        return dataStore.systemTimeData.map(t => t - startTime)
      }
      return dataStore.timeData
    }

    /**
     * 获取指定时间范围内的数据子集
     */
    function getDataInRange(timeData, valueData, minTime, maxTime) {
      const result = []
      for (let i = 0; i < timeData.length; i++) {
        if (timeData[i] >= minTime && timeData[i] <= maxTime) {
          result.push(valueData[i])
        }
      }
      return result
    }

    /**
     * 智能计算Y轴范围 - 使用可见窗口内的数据极值，并添加合理的边距
     */
    function calcSmartYRange(dataArray, paddingRatio = 0.08) {
      if (!dataArray || dataArray.length === 0) return { min: -1, max: 1 }
      const valid = dataArray.filter(v => Number.isFinite(v))
      if (valid.length === 0) return { min: -1, max: 1 }
      const dataMin = Math.min(...valid)
      const dataMax = Math.max(...valid)
      const range = dataMax - dataMin
      if (range < 1e-10) {
        // 数据几乎无变化时，保持一个合理的显示范围
        const center = (dataMax + dataMin) / 2
        return { min: center - 0.5, max: center + 0.5 }
      }
      const padding = range * paddingRatio
      let newMin = dataMin - padding
      let newMax = dataMax + padding
      // 确保不会低于0（对于正数数据）
      if (dataMin >= 0) newMin = Math.max(0, dataMin - padding * 0.5)
      if (dataMax >= 0 && newMax < 0) newMax = dataMax + padding
      return { min: newMin, max: newMax }
    }

    /**
     * 智能更新Y轴范围 - 单向自适应量程（只放大不缩小）
     * 基于可视区间内所有数据点计算，min只降不升，max只升不降
     */
    function updateYAxisRangesSmart() {
      const xScale = mainChart.scales.x
      if (!xScale) return
      const viewMin = Number.isFinite(xScale.min) ? xScale.min : 0
      const viewMax = Number.isFinite(xScale.max) ? xScale.max : 10
      const timeData = getTimeDataSource()

      // 获取可见窗口内的数据
      const vVoltage = getDataInRange(timeData, dataStore.voltageData, viewMin, viewMax)
      const vCurrent = getDataInRange(timeData, dataStore.currentData, viewMin, viewMax)
      const vPower = getDataInRange(timeData, dataStore.powerData, viewMin, viewMax)

      /**
       * 单向扩展应用：新计算的范围与历史最大范围比较，只放大不缩小
       * @param {string} axisId - 轴ID (y/y1/y2)
       * @param {{min:number, max:number}} computedRange - 当前窗口数据计算出的范围
       */
      function applyExpandOnly(axisId, computedRange) {
        const tracked = yAxisExpandedRange[axisId]
        let finalMin, finalMax

        if (tracked.min === undefined || tracked.max === undefined) {
          // 首次：直接使用计算范围
          finalMin = computedRange.min
          finalMax = computedRange.max
        } else {
          // min 只降不升，max 只升不降（始终向外扩展）
          finalMin = Math.min(tracked.min, computedRange.min)
          finalMax = Math.max(tracked.max, computedRange.max)
        }

        tracked.min = finalMin
        tracked.max = finalMax
        mainChart.options.scales[axisId].min = finalMin
        mainChart.options.scales[axisId].max = finalMax
      }

      // 电压轴
      const vRange = calcSmartYRange(vVoltage, 0.05)
      applyExpandOnly('y', vRange)

      // 电流轴
      const cRange = calcSmartYRange(vCurrent, 0.08)
      applyExpandOnly('y1', cRange)

      // 功率轴
      const pRange = calcSmartYRange(vPower, 0.08)
      applyExpandOnly('y2', pRange)
    }

    /**
     * 更新数据密度和曲线平滑度
     */
    function updateTensionAndPointStyle() {
      const totalPoints = dataStore.timeData.length
      if (totalPoints <= 0) return

      const xScale = mainChart.scales.x
      const viewMin = Number.isFinite(xScale?.min) ? xScale.min : 0
      const viewMax = Number.isFinite(xScale?.max) ? xScale.max : 10
      const viewRange = Math.max(0.1, viewMax - viewMin)

      // 计算可见区域的数据密度（点/秒）
      const timeData = getTimeDataSource()
      const visiblePoints = timeData.filter(t => t >= viewMin && t <= viewMax).length
      const density = visiblePoints / viewRange

      // 根据密度调整 tension（平滑度）
      let tension
      if (density > 50) {
        tension = 0.3    // 高密度：更平滑
      } else if (density > 20) {
        tension = 0.2
      } else if (density > 5) {
        tension = 0.15
      } else {
        tension = 0.05    // 低密度：更贴近原始数据
      }

      // 曲线不显示数据点，仅鼠标悬停时高亮当前点
      const pointRadius = 0
      const pointHoverRadius = 5

      mainChart.data.datasets.forEach(ds => {
        ds.tension = tension
        ds.pointRadius = pointRadius
        ds.pointHoverRadius = pointHoverRadius
        ds.borderWidth = density > 100 ? 1.5 : 2
      })
    }

    function rebuildChartData() {
      const timeData = getTimeDataSource()
      const totalTime = timeData.length > 0 ? timeData[timeData.length - 1] : 10
      const dataMin = timeData[0] || 0
      const totalDataRange = Math.max(0.1, totalTime - dataMin)

      // ===== 主视图数据：使用原始数据点（Chart.js 自行渲染） =====
      const voltagePoints = timeData.map((x, idx) => ({ x, y: dataStore.voltageData[idx] }))
      const currentPoints = timeData.map((x, idx) => ({ x, y: dataStore.currentData[idx] }))
      const powerPoints = timeData.map((x, idx) => ({ x, y: dataStore.powerData[idx] }))
      const temperaturePoints = timeData.map((x, idx) => ({ x, y: dataStore.temperatureData[idx] }))
      const chargeMAhPoints = timeData.map((x, idx) => ({ x, y: dataStore.chargeMAhData[idx] }))
      const energyMWhPoints = timeData.map((x, idx) => ({ x, y: dataStore.energyMWhData[idx] }))

      mainChart.data.datasets[0].data = voltagePoints
      mainChart.data.datasets[1].data = currentPoints
      mainChart.data.datasets[2].data = powerPoints
      mainChart.data.datasets[3].data = temperaturePoints
      mainChart.data.datasets[4].data = chargeMAhPoints
      mainChart.data.datasets[5].data = energyMWhPoints

      // ===== 总览视图数据：全量极值抽稀（min/max 双点展开，保留瞬时尖峰） =====
      rebuildOverviewCache()
      overviewChart.data.datasets[0].data = expandMinMax(overviewCache.voltage)
      overviewChart.data.datasets[1].data = expandMinMax(overviewCache.current)
      overviewChart.data.datasets[2].data = expandMinMax(overviewCache.power)

      // ===== 主视图 X 轴区间管理 =====
      if (autoFollow && isStreaming) {
        // 自动跟随：保持当前窗口宽度，始终贴在右侧
        followWindowSize = clamp(followWindowSize, MIN_X_RANGE, Math.max(MIN_X_RANGE, totalDataRange))
        if (totalTime <= followWindowSize) {
          mainChart.options.scales.x.min = 0
          mainChart.options.scales.x.max = Math.max(followWindowSize, totalTime || followWindowSize)
        } else {
          mainChart.options.scales.x.min = totalTime - followWindowSize
          mainChart.options.scales.x.max = totalTime
        }
      } else if (!userInteracted && !isStreaming) {
        // 回看模式无交互：显示全部数据
        mainChart.options.scales.x.min = dataMin
        mainChart.options.scales.x.max = Math.max(totalTime || 10, 10)
        followWindowSize = totalDataRange
      }
      // autoFollow=false 且 userInteracted=true：保持当前视图不变，不执行任何自动平移

      // ===== 总览视图：X轴始终 0 ~ TotalTime（全量） =====
      overviewChart.options.scales.x.min = 0
      overviewChart.options.scales.x.max = Math.max(totalTime, 10)

      // ===== Y轴始终智能更新（单向自适应量程，不受鼠标控制） =====
      updateYAxisRangesSmart()

      // 更新曲线平滑度和点样式
      updateTensionAndPointStyle()

      mainChart.update('none')
      overviewChart.update('none')
      updateZoomStatus()
      updateAutoFollowButton()
    }

    function updateZoomStatus() {
      const scale = mainChart.scales?.x
      const hasData = mainChart.data.datasets.some(d => Array.isArray(d.data) && d.data.length > 0)
      if (!hasData || !scale) {
        elements.zoomStatusText.textContent = '无数据'
        return
      }

      const viewMin = Number.isFinite(scale.min) ? scale.min : 0
      const viewMax = Number.isFinite(scale.max) ? scale.max : 10
      const viewWindow = Math.max(0.01, viewMax - viewMin)
      const dataRange = dataStore.timeData.length > 1
        ? Math.max(0.1, dataStore.timeData[dataStore.timeData.length - 1] - dataStore.timeData[0])
        : 0

      const isFull = dataRange > 0 && viewWindow >= dataRange * 0.97
      const followTag = autoFollow ? ' [跟随]' : ''
      elements.zoomStatusText.textContent =
        `窗口: ${viewWindow.toFixed(2)}s | ${viewMin.toFixed(1)}~${viewMax.toFixed(1)}s${isFull ? ' [全览]' : ''}${followTag}`
    }

    function updateAutoFollowButton() {
      const btn = elements.autoFollowBtn
      if (!btn) return
      if (autoFollow) {
        btn.textContent = '自动跟随 ✓'
        btn.className = 'btn btn-info'
      } else {
        btn.textContent = '自动跟随 ✗'
        btn.className = 'btn btn-secondary'
      }
    }

    function chartHasData(chart) {
      return chart.data.datasets.some(dataset => Array.isArray(dataset.data) && dataset.data.length > 0)
    }

    // ========== 获取数据边界辅助函数 ==========

    function getDataBounds() {
      const timeData = getTimeDataSource()
      return {
        dataMin: timeData.length > 0 ? timeData[0] : 0,
        dataMax: timeData.length > 0 ? timeData[timeData.length - 1] : 10,
        totalRange: timeData.length > 1 ? Math.max(0.1, timeData[timeData.length - 1] - timeData[0]) : 10
      }
    }

    // ========== 1. 滚轮缩放（以光标为中心，XY同步） ==========

    /**
     * 以光标位置为中心，XY轴同步缩放
     * @param {Chart} chart - 主图表
     * @param {number} deltaY - 滚轮方向（负=向上放大，正=向下缩小）
     * @param {number} clientX - 鼠标X坐标
     * @param {number} clientY - 鼠标Y坐标
     */
    function zoomAtCursor(chart, deltaY, clientX, clientY) {
      if (!chartHasData(chart)) return

      const xScale = chart.scales.x
      if (!xScale) return

      const rect = chart.canvas.getBoundingClientRect()
      const px = clientX - rect.left

      // 获取光标在X轴的数据坐标 t
      const t = xScale.getValueForPixel(px)
      if (t === undefined || t === null) return

      const { dataMin, dataMax, totalRange } = getDataBounds()

      // 缩放系数：向上滚(deltaY<0)=放大=收窄区间，向下滚(deltaY>0)=缩小=拓宽区间
      const factor = deltaY < 0 ? 1 / ZOOM_FACTOR : ZOOM_FACTOR

      // === X轴缩放 ===
      const xCurMin = Number.isFinite(xScale.min) ? xScale.min : dataMin
      const xCurMax = Number.isFinite(xScale.max) ? xScale.max : dataMax
      const xRange = Math.max(0.001, xCurMax - xCurMin)
      const newXRange = clamp(xRange * factor, Math.min(MIN_X_RANGE, totalRange), Math.min(totalRange, 999999))
      // 以 t 为中心缩放：t到左右边界的距离等比缩放
      const tRatio = (t - xCurMin) / xRange  // t 距离左边界的比例
      let newXMin = t - newXRange * tRatio
      let newXMax = t + newXRange * (1 - tRatio)
      // 边界约束
      if (newXMin < dataMin) { newXMin = dataMin; newXMax = dataMin + newXRange }
      if (newXMax > dataMax) { newXMax = dataMax; newXMin = dataMax - newXRange }
      // 最终 clamp
      newXMin = Math.max(dataMin, newXMin)
      newXMax = Math.min(dataMax, newXMax)

      chart.options.scales.x.min = newXMin
      chart.options.scales.x.max = newXMax

      // 检测是否拖到最右侧（恢复自动跟随）
      if (isStreaming && newXMax >= dataMax - 0.01) {
        autoFollow = true
      } else {
        autoFollow = false
      }
      userInteracted = true
      followWindowSize = Math.max(MIN_X_RANGE, newXMax - newXMin)

      // Y轴始终自动管理（单向自适应量程）
      updateYAxisRangesSmart()

      chart.update('none')
      overviewChart.update('none')
      updateZoomStatus()
      updateAutoFollowButton()
    }

    // ========== 2. 左键拖拽平移（仅X轴） ==========

    function registerPan(chart) {
      let isPanning = false
      let startClientX = 0
      let startXMin = 0, startXMax = 0

      chart.canvas.addEventListener('mousedown', (evt) => {
        if (evt.button !== 0) return
        // Shift/Ctrl + 左键留给框选，不作为平移
        if (evt.shiftKey || evt.ctrlKey) return
        const rect = chart.canvas.getBoundingClientRect()
        if (evt.clientX < rect.left || evt.clientX > rect.right) return
        if (evt.clientY < rect.top || evt.clientY > rect.bottom) return

        isPanning = true
        startClientX = evt.clientX
        const xs = chart.scales.x
        startXMin = Number.isFinite(xs?.min) ? xs.min : 0
        startXMax = Number.isFinite(xs?.max) ? xs.max : 10
        chart.canvas.style.cursor = 'grabbing'
      })

      document.addEventListener('mousemove', (evt) => {
        if (!isPanning) return
        evt.preventDefault()

        const xs = chart.scales.x
        if (!xs) return

        const rect = chart.canvas.getBoundingClientRect()
        const chartW = rect.right - rect.left
        if (chartW <= 0) return

        // X轴：像素偏移 → 时间偏移
        const pixelsPerUnitX = chartW / Math.max(0.001, startXMax - startXMin)
        const dxData = (startClientX - evt.clientX) / pixelsPerUnitX

        const { dataMin, dataMax } = getDataBounds()
        const xRange = startXMax - startXMin
        let newXMin = startXMin + dxData
        let newXMax = startXMax + dxData
        if (newXMin < dataMin) { newXMin = dataMin; newXMax = dataMin + xRange }
        if (newXMax > dataMax) { newXMax = dataMax; newXMin = dataMax - xRange }

        chart.options.scales.x.min = newXMin
        chart.options.scales.x.max = newXMax

        // 检测是否拖到最右侧
        if (isStreaming && newXMax >= dataMax - 0.01) {
          autoFollow = true
        } else {
          autoFollow = false
        }
        userInteracted = true

        // Y轴始终自动管理
        updateYAxisRangesSmart()

        chart.update('none')
        overviewChart.update('none')
        updateZoomStatus()
        updateAutoFollowButton()
      })

      document.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false
          chart.canvas.style.cursor = ''
          overviewChart.update('none')
        }
      })
    }

    // ========== 3. 左键框选区域放大 ==========

    const selectionRectPlugin = {
      id: 'selectionRectPlugin',
      afterDraw(chart, args, options) {
        if (!options || !options.active || options.x1 == null) return
        const ctx = chart.ctx
        const x1 = Math.min(options.x1, options.x2)
        const y1 = Math.min(options.y1, options.y2)
        const x2 = Math.max(options.x1, options.x2)
        const y2 = Math.max(options.y1, options.y2)
        const w = x2 - x1
        const h = y2 - y1
        if (w < 3 && h < 3) return

        ctx.save()
        ctx.fillStyle = 'rgba(0, 217, 255, 0.10)'
        ctx.fillRect(x1, y1, w, h)
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.60)'
        ctx.lineWidth = 1.5
        ctx.setLineDash([5, 3])
        ctx.strokeRect(x1, y1, w, h)
        ctx.restore()
      }
    }

    function registerSelectionZoom(chart) {
      let isSelecting = false
      let selStartX = 0, selStartY = 0
      let selCurX = 0, selCurY = 0

      chart.canvas.addEventListener('mousedown', (evt) => {
        if (evt.button !== 0) return
        const rect = chart.canvas.getBoundingClientRect()
        if (evt.clientX < rect.left || evt.clientX > rect.right) return
        if (evt.clientY < rect.top || evt.clientY > rect.bottom) return
        if (!chartHasData(chart)) return

        // 使用 Shift 键或 Ctrl 键触发框选，避免和拖拽平移冲突
        if (!evt.shiftKey && !evt.ctrlKey) return

        isSelecting = true
        selStartX = evt.clientX - rect.left
        selStartY = evt.clientY - rect.top
        selCurX = selStartX
        selCurY = selStartY
        chart.options.plugins.selectionRectPlugin = {
          active: true, x1: selStartX, y1: selStartY, x2: selCurX, y2: selCurY
        }
        chart.update('none')
      })

      document.addEventListener('mousemove', (evt) => {
        if (!isSelecting) return
        const rect = chart.canvas.getBoundingClientRect()
        selCurX = evt.clientX - rect.left
        selCurY = evt.clientY - rect.top
        chart.options.plugins.selectionRectPlugin = {
          active: true, x1: selStartX, y1: selStartY, x2: selCurX, y2: selCurY
        }
        chart.update('none')
      })

      document.addEventListener('mouseup', (evt) => {
        if (!isSelecting) return
        isSelecting = false

        const rect = chart.canvas.getBoundingClientRect()
        const ex = evt.clientX - rect.left
        const ey = evt.clientY - rect.top
        const dx = Math.abs(ex - selStartX)
        const dy = Math.abs(ey - selStartY)

        // 最小选区阈值，太小视为误触
        if (dx < 5 && dy < 5) {
          chart.options.plugins.selectionRectPlugin = { active: false }
          chart.update('none')
          return
        }

        // 像素坐标转数据坐标
        const xs = chart.scales.x
        if (!xs) return
        const t1 = xs.getValueForPixel(Math.min(selStartX, ex))
        const t2 = xs.getValueForPixel(Math.max(selStartX, ex))
        if (t1 == null || t2 == null) {
          chart.options.plugins.selectionRectPlugin = { active: false }
          chart.update('none')
          return
        }

        const { dataMin, dataMax } = getDataBounds()
        let newXMin = clamp(t1, dataMin, dataMax)
        let newXMax = clamp(t2, dataMin, dataMax)
        if (newXMax - newXMin < MIN_X_RANGE) {
          const mid = (newXMin + newXMax) / 2
          newXMin = Math.max(dataMin, mid - MIN_X_RANGE / 2)
          newXMax = Math.min(dataMax, mid + MIN_X_RANGE / 2)
        }

        chart.options.scales.x.min = newXMin
        chart.options.scales.x.max = newXMax

        autoFollow = false
        userInteracted = true
        followWindowSize = Math.max(MIN_X_RANGE, newXMax - newXMin)

        // Y轴始终自动管理
        updateYAxisRangesSmart()

        chart.options.plugins.selectionRectPlugin = { active: false }
        chart.update('none')
        overviewChart.update('none')
        updateZoomStatus()
        updateAutoFollowButton()
      })
    }

    // ========== 滚轮事件注册 ==========

    function registerWheelZoom(chart) {
      let wheelTimeout = null
      chart.canvas.addEventListener('wheel', (evt) => {
        if (!chartHasData(chart)) { evt.preventDefault(); return }
        evt.preventDefault()
        zoomAtCursor(chart, evt.deltaY, evt.clientX, evt.clientY)

        if (wheelTimeout) clearTimeout(wheelTimeout)
        wheelTimeout = setTimeout(() => {
          overviewChart.update('none')
          wheelTimeout = null
        }, 50)
      }, { passive: false })
    }

    // ========== 双击/右键重置 ==========

    function registerReset(chart) {
      chart.canvas.addEventListener('dblclick', () => resetViewFull())
      chart.canvas.addEventListener('contextmenu', (evt) => {
        evt.preventDefault()
        resetViewFull()
      })
    }

    function resetViewFull() {
      autoFollow = isStreaming  // 录制中恢复跟随，回看中显示全量
      userInteracted = false
      resetYAxisExpandedRange()

      const { dataMin, dataMax, totalRange } = getDataBounds()
      if (autoFollow && dataMax > 10) {
        followWindowSize = 10
        mainChart.options.scales.x.min = dataMax - 10
        mainChart.options.scales.x.max = dataMax
      } else {
        followWindowSize = Math.max(10, totalRange)
        mainChart.options.scales.x.min = dataMin
        mainChart.options.scales.x.max = Math.max(dataMax || 10, 10)
      }

      // 重置所有Y轴
      ;['y', 'y1', 'y2', 'y3', 'y4', 'y5'].forEach(id => {
        mainChart.options.scales[id].min = undefined
        mainChart.options.scales[id].max = undefined
      })

      mainChart.update('none')
      overviewChart.update('none')
      updateZoomStatus()
      updateAutoFollowButton()
    }

    // ========== 纵览图单击跳转 ==========

    // ========== 总览图交互：单击跳转 + 拖动高亮框 ==========

    const overviewDragState = { active: false, mode: null, startX: 0, startMainMin: 0, startMainMax: 0 }
    const EDGE_THRESHOLD = 8  // 边缘检测像素阈值

    function registerOverviewInteraction(chart) {
      chart.canvas.addEventListener('mousedown', (evt) => {
        if (evt.button !== 0) return
        if (!chartHasData(chart)) return

        const rect = chart.canvas.getBoundingClientRect()
        const mx = evt.clientX - rect.left
        const xScale = chart.scales.x
        const mainX = mainChart.scales.x
        if (!xScale || !mainX) return

        const highlightLeft = xScale.getPixelForValue(mainX.min)
        const highlightRight = xScale.getPixelForValue(mainX.max)
        if (highlightLeft == null || highlightRight == null) return

        // 检测是否在拖拽区域
        const nearLeft = Math.abs(mx - highlightLeft) < EDGE_THRESHOLD
        const nearRight = Math.abs(mx - highlightRight) < EDGE_THRESHOLD
        const inside = mx >= highlightLeft && mx <= highlightRight

        if (nearLeft) {
          overviewDragState.active = true
          overviewDragState.mode = 'left'
        } else if (nearRight) {
          overviewDragState.active = true
          overviewDragState.mode = 'right'
        } else if (inside) {
          overviewDragState.active = true
          overviewDragState.mode = 'move'
        } else {
          // 单击跳转
          const clickValue = xScale.getValueForPixel(mx)
          if (clickValue == null) return
          const { dataMin, dataMax } = getDataBounds()
          const currentRange = mainX.max - mainX.min
          let newMin = clickValue - currentRange / 2
          let newMax = clickValue + currentRange / 2
          if (newMin < dataMin) { newMin = dataMin; newMax = dataMin + currentRange }
          if (newMax > dataMax) { newMax = dataMax; newMin = dataMax - currentRange }
          mainChart.options.scales.x.min = newMin
          mainChart.options.scales.x.max = newMax
          autoFollow = false
          userInteracted = true
          followWindowSize = Math.max(MIN_X_RANGE, newMax - newMin)
          updateYAxisRangesSmart()
          mainChart.update('none')
          chart.update('none')
          updateZoomStatus()
          updateAutoFollowButton()
          return
        }

        overviewDragState.startX = mx
        overviewDragState.startMainMin = mainX.min
        overviewDragState.startMainMax = mainX.max
        chart.canvas.style.cursor = 'ew-resize'
      })

      document.addEventListener('mousemove', (evt) => {
        const rect = chart.canvas.getBoundingClientRect()
        const mx = evt.clientX - rect.left
        const xScale = chart.scales.x
        const mainX = mainChart.scales.x

        if (overviewDragState.active) {
          if (!xScale || !mainX) return
          const clickValue = xScale.getValueForPixel(mx)
          if (clickValue == null) return
          const { dataMin, dataMax } = getDataBounds()

          if (overviewDragState.mode === 'move') {
            const dx = clickValue - xScale.getValueForPixel(overviewDragState.startX)
            const range = overviewDragState.startMainMax - overviewDragState.startMainMin
            let newMin = overviewDragState.startMainMin + dx
            let newMax = overviewDragState.startMainMax + dx
            if (newMin < dataMin) { newMin = dataMin; newMax = dataMin + range }
            if (newMax > dataMax) { newMax = dataMax; newMin = dataMax - range }
            mainChart.options.scales.x.min = newMin
            mainChart.options.scales.x.max = newMax
          } else if (overviewDragState.mode === 'left') {
            let newMin = clickValue
            if (newMin < dataMin) newMin = dataMin
            if (newMin >= overviewDragState.startMainMax - MIN_X_RANGE) newMin = overviewDragState.startMainMax - MIN_X_RANGE
            mainChart.options.scales.x.min = newMin
          } else if (overviewDragState.mode === 'right') {
            let newMax = clickValue
            if (newMax > dataMax) newMax = dataMax
            if (newMax <= overviewDragState.startMainMin + MIN_X_RANGE) newMax = overviewDragState.startMainMin + MIN_X_RANGE
            mainChart.options.scales.x.max = newMax
          }

          autoFollow = false
          userInteracted = true
          followWindowSize = Math.max(MIN_X_RANGE, mainChart.options.scales.x.max - mainChart.options.scales.x.min)
          updateYAxisRangesSmart()
          mainChart.update('none')
          chart.update('none')
          updateZoomStatus()
          updateAutoFollowButton()
          return
        }

        // 鼠标悬停：根据位置改变光标
        if (!xScale || !mainX || !chartHasData(chart)) return
        const hl = xScale.getPixelForValue(mainX.min)
        const hr = xScale.getPixelForValue(mainX.max)
        if (hl == null || hr == null) return
        if (Math.abs(mx - hl) < EDGE_THRESHOLD || Math.abs(mx - hr) < EDGE_THRESHOLD) {
          chart.canvas.style.cursor = 'ew-resize'
        } else if (mx >= hl && mx <= hr) {
          chart.canvas.style.cursor = 'grab'
        } else {
          chart.canvas.style.cursor = 'pointer'
        }
      })

      document.addEventListener('mouseup', () => {
        if (overviewDragState.active) {
          overviewDragState.active = false
          overviewDragState.mode = null
          chart.canvas.style.cursor = ''
          chart.update('none')
        }
      })
    }

    // 创建主图表
    const mainCtx = document.getElementById('mainChart').getContext('2d')
    const mainChart = new Chart(mainCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {

            borderColor: chartConfig.voltage.color,

            pointBackgroundColor: chartConfig.voltage.color,
            pointBorderColor: chartConfig.voltage.color,
            borderWidth: 2,

          },
          {
            label: chartConfig.current.label,
            data: [],
            borderColor: chartConfig.current.color,
            backgroundColor: chartConfig.current.color,
            pointBackgroundColor: chartConfig.current.color,
            pointBorderColor: chartConfig.current.color,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0.1,
            yAxisID: 'y1'
          },
          {
            label: chartConfig.power.label,
            data: [],
            borderColor: chartConfig.power.color,
            backgroundColor: chartConfig.power.color,
            pointBackgroundColor: chartConfig.power.color,
            pointBorderColor: chartConfig.power.color,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0.1,
            yAxisID: 'y2'
          },
          {
            label: chartConfig.temperature.label,
            data: [],
            borderColor: chartConfig.temperature.color,
            backgroundColor: chartConfig.temperature.color,
            pointBackgroundColor: chartConfig.temperature.color,
            pointBorderColor: chartConfig.temperature.color,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0.1,
            yAxisID: 'y3',
            hidden: true
          },
          {
            label: chartConfig.chargeMAh.label,
            data: [],
            borderColor: chartConfig.chargeMAh.color,
            backgroundColor: chartConfig.chargeMAh.color,
            pointBackgroundColor: chartConfig.chargeMAh.color,
            pointBorderColor: chartConfig.chargeMAh.color,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0.1,
            yAxisID: 'y4',
            hidden: true
          },
          {
            label: chartConfig.energyMWh.label,
            data: [],
            borderColor: chartConfig.energyMWh.color,
            backgroundColor: chartConfig.energyMWh.color,
            pointBackgroundColor: chartConfig.energyMWh.color,
            pointBorderColor: chartConfig.energyMWh.color,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0.1,
            yAxisID: 'y5',
            hidden: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 0 },
        resizeDelay: 100,
        interaction: {
          mode: 'nearest',
          axis: 'x',
          intersect: false
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a2e',
            titleColor: '#00d9ff',
            bodyColor: '#eaeaea',
            borderColor: '#0066CC',
            borderWidth: 1,
            callbacks: {
              title: function(context) {
                return 'Time(s):' + context[0].parsed.x.toFixed(3)
              }
            }
          },
          zoom: {
            limits: {
              x: {
                min: 0,
                max: 999999
              },
              y: { min: -1000, max: 1000 }
            },
            pan: {
              enabled: false
            },
            zoom: {
              wheel: {
                enabled: false
              },
              pinch: {
                enabled: true
              },
              mode: 'x',
              onZoom: ({ chart }) => {
                userInteracted = true
                autoFollow = false
                const xs = chart.scales.x
                if (xs) followWindowSize = Math.max(MIN_X_RANGE, (xs.max || 10) - (xs.min || 0))
                updateAutoFollowButton()
              },
              onZoomComplete: ({ chart }) => {
                overviewChart.update('none')  // 刷新纵览图的选择窗口
                updateZoomStatus()
              }
            }
          },
          crosshairPlugin: {
            color: 'rgba(255,255,255,0.5)',
            lineWidth: 1,
            dash: [4, 4],
            alpha: 0.45
          }
        },
        scales: {
          x: {
            type: 'linear',
            display: true,
            title: { display: true, text: '时间 (s)', color: '#a0a0a0' },
            ticks: {
              color: '#a0a0a0',
              maxTicksLimit: 12,
              autoSkip: true,
              autoSkipPadding: 15,
              callback: function(value) {
                const range = this.chart.scales.x.max - this.chart.scales.x.min
                if (range < 2) return value.toFixed(3)
                if (range < 20) return value.toFixed(2)
                if (range < 200) return value.toFixed(1)
                return value.toFixed(0)
              }
            },
            min: 0,
            max: 10,
            grid: { color: 'rgba(255,255,255,0.1)' }
          },
          y: {
            type: 'linear',
            display: true,
            position: 'left',
            title: { display: true, text: '电压 (V)', color: chartConfig.voltage.color },
            ticks: { color: chartConfig.voltage.color },
            grid: { color: 'rgba(255,255,255,0.1)' }
          },
          y1: {
            type: 'linear',
            display: true,
            position: 'right',
            title: { display: true, text: '电流 (A)', color: chartConfig.current.color },
            ticks: { color: chartConfig.current.color },
            grid: { drawOnChartArea: false }
          },
          y2: {
            type: 'linear',
            display: true,
            position: 'right',
            offset: true,
            title: { display: true, text: '功率 (W)', color: chartConfig.power.color },
            ticks: { color: chartConfig.power.color },
            grid: { drawOnChartArea: false }
          },
          y3: {
            type: 'linear',
            display: false,
            position: 'right',
            title: { display: true, text: '温度 (°C)', color: chartConfig.temperature.color },
            ticks: { color: chartConfig.temperature.color },
            grid: { drawOnChartArea: false }
          },
          y4: {
            type: 'linear',
            display: false,
            position: 'right',
            title: { display: true, text: 'mAh', color: chartConfig.chargeMAh.color },
            ticks: { color: chartConfig.chargeMAh.color },
            grid: { drawOnChartArea: false }
          },
          y5: {
            type: 'linear',
            display: false,
            position: 'right',
            title: { display: true, text: 'mWh', color: chartConfig.energyMWh.color },
            ticks: { color: chartConfig.energyMWh.color },
            grid: { drawOnChartArea: false }
          }
        }
      },
      plugins: [crosshairPlugin, selectionRectPlugin]
    })

    // 初始化框选插件选项
    mainChart.options.plugins.selectionRectPlugin = { active: false }

    const overviewSelectionPlugin = {
      id: 'overviewSelectionPlugin',
      afterDraw(chart) {
        const mainScale = mainChart.scales.x
        const overviewScale = chart.scales.x
        if (!mainScale || !overviewScale || mainScale.min == null || mainScale.max == null) {
          return
        }

        const ctx = chart.ctx
        const left = overviewScale.getPixelForValue(mainScale.min)
        const right = overviewScale.getPixelForValue(mainScale.max)
        const top = chart.chartArea.top
        const bottom = chart.chartArea.bottom

        if (left === undefined || right === undefined || isNaN(left) || isNaN(right)) return

        ctx.save()

        // 非选中区域（左右两侧）加暗色遮罩
        ctx.fillStyle = 'rgba(0, 0, 0, 0.30)'
        if (left > chart.chartArea.left) {
          ctx.fillRect(chart.chartArea.left, top, left - chart.chartArea.left, bottom - top)
        }
        if (right < chart.chartArea.right) {
          ctx.fillRect(right, top, chart.chartArea.right - right, bottom - top)
        }

        // 选中区域的高亮填充（半透明蓝色渐变）
        const gradient = ctx.createLinearGradient(left, top, right, top)
        gradient.addColorStop(0, 'rgba(0, 217, 255, 0.15)')
        gradient.addColorStop(0.5, 'rgba(0, 217, 255, 0.06)')
        gradient.addColorStop(1, 'rgba(0, 217, 255, 0.15)')
        ctx.fillStyle = gradient
        ctx.fillRect(left, top, right - left, bottom - top)

        // 选中区域的左右边框（实线更清晰）
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.60)'
        ctx.lineWidth = 2
        ctx.beginPath()
        ctx.moveTo(left, top)
        ctx.lineTo(left, bottom)
        ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(right, top)
        ctx.lineTo(right, bottom)
        ctx.stroke()

        // 顶部和底部的横线（让窗口更明显）
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.25)'
        ctx.lineWidth = 1
        ctx.setLineDash([3, 3])
        ctx.beginPath()
        ctx.moveTo(left, top)
        ctx.lineTo(right, top)
        ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(left, bottom)
        ctx.lineTo(right, bottom)
        ctx.stroke()
        ctx.setLineDash([])

        // 左右两侧的拖拽手柄
        ctx.fillStyle = 'rgba(0, 217, 255, 0.70)'
        const hw = 4, hh = 8
        ctx.fillRect(left - hw, (top + bottom) / 2 - hh, hw * 2, hh * 2)
        ctx.fillRect(right - hw, (top + bottom) / 2 - hh, hw * 2, hh * 2)

        ctx.restore()
      }
    }

    // 创建总览图表
    const overviewCtx = document.getElementById('overviewChart').getContext('2d')
    const overviewChart = new Chart(overviewCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: '电压',
            data: [],
            borderColor: chartConfig.voltage.color,
            backgroundColor: 'transparent',
            borderWidth: 1.5,
            tension: 0.1,
            pointRadius: 0
          },
          {
            label: '电流',
            data: [],
            borderColor: chartConfig.current.color,
            backgroundColor: 'transparent',
            borderWidth: 1.5,
            tension: 0.1,
            pointRadius: 0
          },
          {
            label: '功率',
            data: [],
            borderColor: chartConfig.power.color,
            backgroundColor: 'transparent',
            borderWidth: 1.5,
            tension: 0.1,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 0 },
        interaction: {
          mode: 'nearest',
          axis: 'x',
          intersect: false
        },
        plugins: {
          legend: { display: false },
          zoom: {
            limits: {
              x: { min: 0, max: 999999 },
              y: { min: -1000, max: 1000 }
            },
            pan: {
              enabled: false
            },
            zoom: {
              wheel: {
                enabled: false
              },
              pinch: {
                enabled: false  // 纵览图禁止缩放，始终显示全量数据
              }
            }
          }
        },
        scales: {
          x: {
            type: 'linear',
            display: true,
            title: { display: true, text: '时间 (s)', color: '#a0a0a0' },
            ticks: {
              color: '#a0a0a0',
              maxTicksLimit: 10,
              callback: value => value.toFixed(1)
            },
            grid: { color: 'rgba(255,255,255,0.03)' }
          },
          y: {
            display: false,
            ticks: { color: '#a0a0a0' },
            grid: { color: 'rgba(255,255,255,0.03)' }
          }
        },
        elements: {
          point: { radius: 1, hoverRadius: 3 },
          line: { borderWidth: 1.2, spanGaps: true }
        }
      },
      plugins: [overviewSelectionPlugin]
    })

    // 主图：滚轮缩放 + 拖拽平移 + 框选放大 + 双击/右键重置
    registerWheelZoom(mainChart)
    registerPan(mainChart)
    registerSelectionZoom(mainChart)
    registerReset(mainChart)
    // 纵览图：单击跳转 + 拖动高亮框
    registerOverviewInteraction(overviewChart)

    // 更新图表数据
    function updateCharts(data) {
      // 以首个采样点为时间零点，保证X轴始终从0开始从左到右
      if (recordingStartUs === null) {
        recordingStartUs = data.espTimeUs
      }
      const timeSeconds = (data.espTimeUs - recordingStartUs) / 1000000.0

      // 添加数据
      const systemTimeSeconds = Date.now() / 1000
      dataStore.timeData.push(timeSeconds)
      dataStore.systemTimeData.push(systemTimeSeconds)
      dataStore.espTimeUsData.push(data.espTimeUs)
      dataStore.voltageData.push(data.voltage)
      dataStore.currentData.push(data.current)
      dataStore.powerData.push(data.power)
      dataStore.temperatureData.push(data.temperatureAdc)
      dataStore.temperatureCpuData.push(data.temperatureCpu)
      dataStore.energyMWhData.push(data.energyMWh)
      dataStore.chargeMAhData.push(data.chargeMAh)

      // 限制数据点数量
      if (dataStore.timeData.length > MAX_POINTS) {
        dataStore.timeData.shift()
        dataStore.systemTimeData.shift()
        dataStore.espTimeUsData.shift()
        dataStore.voltageData.shift()
        dataStore.currentData.shift()
        dataStore.powerData.shift()
        dataStore.temperatureData.shift()
        dataStore.temperatureCpuData.shift()
        dataStore.energyMWhData.shift()
        dataStore.chargeMAhData.shift()
      }

      rebuildChartData()

      // 更新数据显示
      updateDataLabels(data)
    }

    // 更新数据标签
    function updateDataLabels(data) {
      elements.voltageLabel.textContent = data.voltage.toFixed(4) + ' V'
      elements.currentLabel.textContent = data.current.toFixed(4) + ' A'
      elements.powerLabel.textContent = data.power.toFixed(4) + ' W'
      elements.tempLabel.textContent = data.temperatureAdc.toFixed(2) + ' °C'
      elements.cpuTempLabel.textContent = data.temperatureCpu.toFixed(2) + ' °C'
      elements.whLabel.textContent = (data.energyMWh / 1000).toFixed(4) + ' Wh'
      elements.ahLabel.textContent = (data.chargeMAh / 1000).toFixed(4) + ' Ah'
      elements.mwhLabel.textContent = data.energyMWh.toFixed(4) + ' mWh'
      elements.mahLabel.textContent = data.chargeMAh.toFixed(4) + ' mAh'
      elements.directionLabel.textContent = data.currentDirection ? '充电' : '放电'
      elements.countLabel.textContent = dataStore.timeData.length
    }

    // 更新 HEX 显示
    function updateHexDisplay(data) {
      let hexStr = `时间: ${data.espTimeUs} us\n`
      hexStr += `CPU温度: ${data.temperatureCpu.toFixed(2)} °C\n`
      hexStr += `ADC温度: ${data.temperatureAdc.toFixed(2)} °C\n`
      hexStr += `电压: ${data.voltage.toFixed(4)} V\n`
      hexStr += `电流: ${data.current.toFixed(4)} A\n`
      hexStr += `功率: ${data.power.toFixed(4)} W\n`
      hexStr += `mWh: ${data.energyMWh.toFixed(4)}\n`
      hexStr += `mAh: ${data.chargeMAh.toFixed(4)}`
      elements.hexDisplay.textContent = hexStr
    }

    // 切换数据采集
    async function toggleStream() {
      if (isStreaming) {
        stopStreaming()
      } else {
        autoFollow = true
        userInteracted = false
        followWindowSize = 10
        updateAutoFollowButton()
        await startStreaming()
      }
    }

    // 开始采集
    async function startStreaming() {
      // 检查串口是否已连接
      const isOpen = await window.electronAPI.isPortOpen()
      if (!isOpen) {
        alert('请先在主界面打开串口！')
        return
      }

      resetYAxisExpandedRange()
      recordingStartUs = null
      followWindowSize = 10
      isStreaming = true
      elements.toggleStreamBtn.textContent = '停止采集'
      elements.toggleStreamBtn.className = 'btn btn-danger'
      elements.statusLabel.textContent = '状态: 采集中...'

      const interval = parseInt(elements.intervalSelect.value)

      streamInterval = setInterval(async () => {
        try {
          await window.electronAPI.requestData()
        } catch (err) {
          console.error('请求数据失败:', err)
        }
      }, interval)
    }

    // 停止采集
    function stopStreaming() {
      isStreaming = false
      if (streamInterval) {
        clearInterval(streamInterval)
        streamInterval = null
      }
      elements.toggleStreamBtn.textContent = '开始采集'
      elements.toggleStreamBtn.className = 'btn btn-success'
      elements.statusLabel.textContent = '状态: 已停止'
    }

    // 更新存储深度预计时长提示
    function updateDepthHint() {
      const mb = parseInt(elements.depthSelect.value)
      const points = mb * POINTS_PER_MB
      const intervalMs = parseInt(elements.intervalSelect.value)
      const totalSeconds = (points * intervalMs) / 1000
      let hint
      if (totalSeconds < 60) {
        hint = `约${totalSeconds.toFixed(0)}秒`
      } else if (totalSeconds < 3600) {
        hint = `约${Math.floor(totalSeconds / 60)}分${Math.floor(totalSeconds % 60)}秒`
      } else if (totalSeconds < 86400) {
        hint = `约${Math.floor(totalSeconds / 3600)}小时${Math.floor((totalSeconds % 3600) / 60)}分钟`
      } else {
        const days = Math.floor(totalSeconds / 86400)
        const hours = Math.floor((totalSeconds % 86400) / 3600)
        hint = `约${days}天${hours}小时`
      }
      elements.depthHint.textContent = hint
    }

    // 按当前存储深度裁剪数据（切换深度时从头部丢弃多余数据）
    function trimDataToLimit() {
      const keys = Object.keys(dataStore)
      while (dataStore.timeData.length > MAX_POINTS) {
        keys.forEach(k => dataStore[k].shift())
      }
    }

    // 清空数据
    function clearData() {
      Object.keys(dataStore).forEach(key => {
        dataStore[key] = []
      })
      // 清空抽稀缓存
      overviewCache.time = []; overviewCache.voltage = []; overviewCache.current = []; overviewCache.power = []
      mainCache.time = []; mainCache.voltage = []; mainCache.current = []; mainCache.power = []

      autoFollow = true
      userInteracted = false
      recordingStartUs = null
      followWindowSize = 10
      mainChart.data.labels = []
      mainChart.data.datasets.forEach(ds => ds.data = [])
      overviewChart.data.labels = []
      overviewChart.data.datasets.forEach(ds => ds.data = [])
      mainChart.options.scales.x.min = 0
      mainChart.options.scales.x.max = 10
      overviewChart.options.scales.x.min = 0
      overviewChart.options.scales.x.max = 10
      // 重置Y轴显示范围
      ;['y', 'y1', 'y2', 'y3', 'y4', 'y5'].forEach(id => {
        mainChart.options.scales[id].min = undefined
        mainChart.options.scales[id].max = undefined
      })
      resetYAxisExpandedRange()

      mainChart.update('none')
      overviewChart.update('none')
      updateZoomStatus()
      updateAutoFollowButton()

      elements.countLabel.textContent = '0'
      elements.hexDisplay.textContent = '等待开始采集...'
    }

    // 重置视图
    function resetView() {
      resetViewFull()
    }

    // 保存数据
    async function saveData() {
      if (dataStore.timeData.length === 0) {
        alert('没有数据可保存！')
        return
      }

      const now = new Date()
      const defaultName = `curve_data_${now.getFullYear()}${(now.getMonth() + 1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}${now.getSeconds().toString().padStart(2, '0')}.csv`

      const result = await window.electronAPI.saveDialog(defaultName, [
        { name: 'CSV Files', extensions: ['csv'] },
        { name: 'All Files', extensions: ['*'] }
      ])

      if (result.filePath) {
        let csv = '序号,时间(秒),时间戳(us),电压(V),电流(A),功率(W),温度(°C),能量(mWh),容量(mAh)\n'

        for (let i = 0; i < dataStore.timeData.length; i++) {
          csv += `${i + 1},${dataStore.timeData[i].toFixed(3)},${dataStore.espTimeUsData[i]},`
          csv += `${dataStore.voltageData[i].toFixed(4)},${dataStore.currentData[i].toFixed(4)},${dataStore.powerData[i].toFixed(4)},`
          csv += `${dataStore.temperatureData[i].toFixed(2)},${dataStore.energyMWhData[i].toFixed(4)},${dataStore.chargeMAhData[i].toFixed(4)}\n`
        }

        const saveResult = await window.electronAPI.saveLogFile(result.filePath, '\ufeff' + csv)
        if (saveResult.success) {
          alert(`数据已保存至:\n${result.filePath}`)
        } else {
          alert(`保存失败: ${saveResult.error}`)
        }
      }
    }

    // 保存整个界面为 PNG 图片
    async function saveChartAsImage() {
      try {
        // 使用 html2canvas 捕获整个页面
        const canvas = await html2canvas(document.body, {
          backgroundColor: '#0f0f1a',
          scale: 2,
          logging: false,
          useCORS: true
        })

        // 转换为数据 URL
        const dataUrl = canvas.toDataURL('image/png')

        // 打开保存对话框
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)
        const result = await window.electronAPI.saveImageDialog(`curve_${timestamp}.png`)

        if (!result.canceled && result.filePath) {
          const saveResult = await window.electronAPI.saveImageFile(result.filePath, dataUrl)
          if (saveResult.success) {
            alert(`曲线图片已保存至:\n${result.filePath}`)
          } else {
            alert(`保存失败: ${saveResult.error}`)
          }
        }
      } catch (err) {
        alert(`保存失败: ${err.message}`)
      }
    }

    // 切换曲线显示
    function toggleDataset(index, visible) {
      mainChart.data.datasets[index].hidden = !visible

      const yAxisMap = { 3: 'y3', 4: 'y4', 5: 'y5' }
      if (yAxisMap[index]) {
        mainChart.options.scales[yAxisMap[index]].display = visible
      }

      mainChart.update('none')
    }

    // 存储深度切换
    elements.depthSelect.addEventListener('change', () => {
      MAX_POINTS = parseInt(elements.depthSelect.value) * POINTS_PER_MB
      updateDepthHint()
      trimDataToLimit()
      rebuildChartData()
    })

    // 采样间隔切换时更新预计时长
    elements.intervalSelect.addEventListener('change', () => {
      updateDepthHint()
    })

    // 设置事件监听
    elements.toggleStreamBtn.addEventListener('click', toggleStream)
    elements.clearDataBtn.addEventListener('click', clearData)
    elements.resetViewBtn.addEventListener('click', resetView)
    elements.saveDataBtn.addEventListener('click', saveData)
    elements.saveImageBtn.addEventListener('click', saveChartAsImage)

    elements.showTempCheck.addEventListener('change', (e) => toggleDataset(3, e.target.checked))
    elements.showMahCheck.addEventListener('change', (e) => toggleDataset(4, e.target.checked))
    elements.showMwhCheck.addEventListener('change', (e) => toggleDataset(5, e.target.checked))
    elements.useSystemTimeCheck.addEventListener('change', () => {
      autoFollow = true
      userInteracted = false
      followWindowSize = 10
      rebuildChartData()
    })

    // 自动跟随按钮：保持当前窗口宽度，跳至最右侧
    elements.autoFollowBtn.addEventListener('click', () => {
      if (autoFollow) return
      const timeData = getTimeDataSource()
      const totalTime = timeData.length > 0 ? timeData[timeData.length - 1] : 0
      followWindowSize = clamp(followWindowSize, MIN_X_RANGE, Math.max(MIN_X_RANGE, totalTime))
      autoFollow = true
      userInteracted = false
      resetYAxisExpandedRange()
      rebuildChartData()
    })

    // 监听电表数据
    window.electronAPI.onMeterData((data) => {
      if (isStreaming) {
        updateCharts(data)
        updateHexDisplay(data)
      }
    })

    // 监听菜单事件
    window.electronAPI.onMenuSaveImage(() => {
      saveChartAsImage()
    })

    window.electronAPI.onMenuSaveData(() => {
      saveData()
    })

    window.electronAPI.onMenuResetView(() => {
      resetView()
    })

    // 初始化主题
    async function initTheme() {
      const theme = await window.electronAPI.getTheme()
      applyTheme(theme)
    }

    function applyTheme(theme) {
      document.body.classList.remove('theme-light', 'theme-dark')
      document.body.classList.add(`theme-${theme}`)
    }

    // 监听主题变化
    window.electronAPI.onThemeChanged((theme) => {
      applyTheme(theme)
    })

    // 启动时初始化主题
    initTheme()
    updateAutoFollowButton()
    updateDepthHint()
  </script>
</body>
</html>
