<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-USB-METER 上位机</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 更新弹窗（叠加层） -->
  <div id="updateOverlay" class="update-overlay" style="display: none;">
    <div id="updateModal" class="update-modal">
      <button id="updateCloseBtn" class="update-close">&times;</button>

      <!-- 状态1: 发现更新 -->
      <div id="updateStateInfo" class="update-state">
        <div class="update-header">
          <svg class="update-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/>
          </svg>
          <div>
            <div class="update-title">发现新版本 <span id="updateNewVersion">v--</span></div>
            <div class="update-subtitle">当前 v<span id="updateCurrentVersion">--</span> · <span id="updateAssetInfo">--</span></div>
          </div>
        </div>
        <div class="update-changelog" id="updateChangelog"></div>
        <div class="update-actions">
          <button id="updateDownloadBtn" class="update-btn update-btn-primary">下载更新</button>
          <button id="updateDismissBtn" class="update-btn update-btn-ghost">稍后提醒</button>
          <button id="updateViewReleaseBtn" class="update-btn update-btn-ghost">查看详情</button>
        </div>
      </div>

      <!-- 状态2: 下载中 -->
      <div id="updateStateProgress" class="update-state" style="display: none;">
        <div class="update-title" id="updateProgressTitle">正在下载更新...</div>
        <div class="update-progress-bar-wrap">
          <div class="update-progress-bar">
            <div class="update-progress-fill" id="updateProgressFill"></div>
          </div>
          <span class="update-progress-text" id="updatePercent">0%</span>
        </div>
        <div class="update-progress-meta">
          <span id="updateSpeed">--</span>
          <span id="updateRemaining">--</span>
          <span id="updateSizeInfo">--</span>
        </div>
        <div class="update-actions">
          <button id="updateCancelBtn" class="update-btn update-btn-ghost">取消下载</button>
        </div>
      </div>

      <!-- 状态3: 下载完成 -->
      <div id="updateStateComplete" class="update-state" style="display: none;">
        <div class="update-header">
          <svg class="update-icon-svg update-icon-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/>
          </svg>
          <div>
            <div class="update-title" id="updateCompleteTitle">更新已准备就绪！</div>
            <div class="update-subtitle" id="updateCompleteSub"></div>
          </div>
        </div>
        <div class="update-actions" id="updateCompleteActions"></div>
      </div>
    </div>
  </div>

  <!-- 固件更新弹窗（复用更新弹窗样式） -->
  <div id="firmwareUpdateOverlay" class="update-overlay" style="display: none;">
    <div class="update-modal">
      <button id="firmwareUpdateCloseBtn" class="update-close">&times;</button>

      <div id="firmwareUpdateStateInfo" class="update-state">
        <div class="update-header">
          <svg class="update-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/>
          </svg>
          <div>
            <div class="update-title">发现固件新版本 <span id="firmwareUpdateNewVersion">v--</span></div>
            <div class="update-subtitle">当前固件 v<span id="firmwareUpdateCurrentVersion">--</span></div>
          </div>
        </div>
        <div class="update-changelog" id="firmwareUpdateChangelog"></div>
        <div class="update-actions">
          <button id="firmwareUpdateGoBtn" class="update-btn update-btn-primary">立即更新</button>
          <button id="firmwareUpdateViewBtn" class="update-btn update-btn-ghost">查看发布页</button>
          <button id="firmwareUpdateDismissBtn" class="update-btn update-btn-ghost">稍后</button>
        </div>
      </div>

      <div id="firmwareUpdateStateProgress" class="update-state" style="display: none;">
        <div class="update-title">正在下载并准备固件...</div>
        <div class="update-progress-bar-wrap">
          <div class="update-progress-bar">
            <div class="update-progress-fill" id="firmwareUpdateProgressFill"></div>
          </div>
          <span class="update-progress-text" id="firmwareUpdatePercent">0%</span>
        </div>
        <div class="update-progress-meta">
          <span id="firmwareUpdateSpeed">--</span>
          <span id="firmwareUpdateRemaining">--</span>
          <span id="firmwareUpdateSizeInfo">--</span>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 串口设置 -->
    <div class="card">
      <div class="card-header">串口设置</div>
      <div class="form-row">
        <label>端口:</label>
        <select id="portSelect">
          <option value="">选择端口...</option>
        </select>
        <label style="display: none;">波特率:</label>
        <select id="baudSelect" style="display: none;">
          <option value="9600">9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="57600">57600</option>
          <option value="115200">115200</option>
          <option value="921600" selected>921600</option>
        </select>
        <button id="togglePortBtn" class="btn btn-success">打开端口</button>
        <button id="refreshPortsBtn" class="btn btn-secondary">刷新端口</button>
      </div>
      <div class="form-row">
        <div class="status-indicator">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">未连接</span>
        </div>
        <div class="device-info" id="deviceInfo" style="display: none;">
          <span class="device-info-separator">|</span>
          <span class="device-info-item"><strong>SN:</strong> <span id="devSN">--</span></span>
          <span class="device-info-separator">|</span>
          <span class="device-info-item"><strong>SW:</strong> <span id="devSW">--</span></span>
          <span class="device-info-separator">|</span>
          <span class="device-info-item"><strong>HW:</strong> <span id="devHW">--</span></span>
        </div>
      </div>
    </div>

    <!-- 控制区域 -->
    <div class="card">
      <div class="card-header">控制区域</div>

      <!-- 亮度设置 -->
      <div class="form-row">
        <label>屏幕亮度:</label>
        <input type="range" id="brightnessRange" min="1" max="100" value="50">
        <div class="number-input">
          <button id="brightnessMinus" class="number-btn">-</button>
          <input type="number" id="brightnessInput" min="1" max="100" value="50">
          <button id="brightnessPlus" class="number-btn">+</button>
        </div>
        <button id="setBrightnessBtn" class="btn btn-primary">设置亮度</button>
      </div>

      <!-- 屏幕方向 -->
      <div class="form-row">
        <label>屏幕方向:</label>
        <select id="rotationSelect">
          <option value="1">按键朝下</option>
          <option value="3" selected>按键朝上</option>
        </select>
        <button id="setRotationBtn" class="btn btn-primary">设置方向</button>
      </div>

      <!-- 采样率 -->
      <div class="form-row">
        <label>采样率:</label>
        <select id="sampleRateSelect">
          <option value="0">快速</option>
          <option value="1" selected>默认</option>
          <option value="2">慢速</option>
        </select>
        <button id="setSampleRateBtn" class="btn btn-primary">设置采样率</button>
      </div>

      <!-- 阈值设置 -->
      <div class="form-row threshold-row">
        <label>阈值:</label>
        <div class="threshold-group">
          <span class="threshold-label">起始</span>
          <div class="number-input number-input-sm">
            <button id="thrStartVMinus" class="number-btn number-btn-sm">-</button>
            <input type="number" id="thrStartV" class="threshold-input" placeholder="mV" value="0" min="0">
            <button id="thrStartVPlus" class="number-btn number-btn-sm">+</button>
          </div>
          <span class="threshold-unit">mV</span>
          <div class="number-input number-input-sm">
            <button id="thrStartIMinus" class="number-btn number-btn-sm">-</button>
            <input type="number" id="thrStartI" class="threshold-input" placeholder="mA" value="0" min="0">
            <button id="thrStartIPlus" class="number-btn number-btn-sm">+</button>
          </div>
          <span class="threshold-unit">mA</span>
          <button id="setStartBtn" class="btn btn-primary btn-sm">设置起始</button>
        </div>
        <div class="threshold-group">
          <span class="threshold-label">结束</span>
          <div class="number-input number-input-sm">
            <button id="thrEndVMinus" class="number-btn number-btn-sm">-</button>
            <input type="number" id="thrEndV" class="threshold-input" placeholder="mV" value="0" min="0">
            <button id="thrEndVPlus" class="number-btn number-btn-sm">+</button>
          </div>
          <span class="threshold-unit">mV</span>
          <div class="number-input number-input-sm">
            <button id="thrEndIMinus" class="number-btn number-btn-sm">-</button>
            <input type="number" id="thrEndI" class="threshold-input" placeholder="mA" value="0" min="0">
            <button id="thrEndIPlus" class="number-btn number-btn-sm">+</button>
          </div>
          <span class="threshold-unit">mA</span>
          <button id="setEndBtn" class="btn btn-primary btn-sm">设置结束</button>
        </div>
        <button id="queryThresholdBtn" class="btn btn-secondary btn-sm">查询阈值</button>
      </div>

      <!-- 常用命令 -->
      <div class="form-row">
        <button id="queryInfoBtn" class="btn btn-secondary">查询信息</button>
        <button id="helpBtn" class="btn btn-secondary">帮助</button>
        <button id="resetDefaultsBtn" class="btn btn-warning">恢复默认设置</button>
        <button id="openCurveBtn" class="btn btn-info">曲线界面</button>
        <button id="openOfflineBtn" class="btn btn-info">离线数据</button>
        <div class="button-separator"></div>
        <button id="openFirmwareBtn" class="btn btn-success">固件更新</button>
      </div>

      <!-- 自定义命令 -->
      <div class="form-row">
        <input type="text" id="customCmdInput" placeholder="输入自定义命令..." style="flex: 1;">
        <button id="sendCustomBtn" class="btn btn-primary">发送</button>
      </div>
    </div>

    <!-- 串口接收 -->
    <div class="card">
      <div class="card-header">接收区域</div>
      <div class="form-row">
        <div class="checkbox-group">
          <input type="checkbox" id="autoScrollCheck" checked>
          <label for="autoScrollCheck">自动滚屏</label>
        </div>
        <button id="clearLogBtn" class="btn btn-danger" style="margin-left: auto;">清空</button>
        <button id="saveLogBtn" class="btn btn-secondary">保存内容</button>
      </div>
      <div id="logArea" class="log-area"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
