<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线数据查看</title>
  <link rel="stylesheet" href="styles.css">
  <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 10px;
      height: 100vh;
      overflow: hidden;
    }
    .offline-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: calc(100vh - 20px);
    }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar .spacer {
      flex: 1;
    }
    .status-text {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'Consolas', monospace;
      white-space: nowrap;
    }
    .offline-main {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .left-panel .card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .left-panel .card:first-child {
      flex: 1;
      min-height: 120px;
    }
    .left-panel .card:last-child {
      flex: 1;
    }
    .entry-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }
    .entry-list li {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-primary);
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .entry-list li:hover {
      background: var(--bg-tertiary);
    }
    .entry-list li.selected {
      border-color: var(--accent-blue);
      background: var(--bg-tertiary);
    }
    .entry-list li .entry-meta {
      color: var(--text-secondary);
      font-size: 11px;
    }
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .right-panel .card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .export-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: var(--bg-tertiary);
      border-radius: 6px;
    }
    .export-progress[hidden] { display: none; }
    .export-progress-label {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .export-progress-track {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }
    .export-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-blue);
      border-radius: 4px;
      transition: width 0.12s ease;
    }
    .export-progress-fill.indeterminate {
      width: 40%;
      animation: progressIndeterminate 1.2s ease-in-out infinite;
    }
    @keyframes progressIndeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .export-progress-pct {
      font-size: 12px;
      color: var(--accent-blue);
      font-family: 'Consolas', monospace;
      white-space: nowrap;
      min-width: 40px;
      text-align: right;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }
    .summary-item {
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .summary-item .label {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .summary-item .value {
      font-size: 15px;
      font-weight: 600;
      font-family: 'Consolas', monospace;
    }
    .table-wrap {
      overflow: auto;
      flex: 1;
      min-height: 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead th {
      position: sticky;
      top: 0;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      text-align: right;
      padding: 6px 8px;
      white-space: nowrap;
      z-index: 1;
      border-bottom: 1px solid var(--border-color);
    }
    tbody td {
      padding: 0 8px;
      height: 24px;
      line-height: 24px;
      text-align: right;
      white-space: nowrap;
      font-family: 'Consolas', monospace;
      border-bottom: 1px solid var(--border-color);
      box-sizing: border-box;
    }
    tbody tr:nth-child(even) {
      background: rgba(128, 128, 128, 0.05);
    }
    .chart-card {
      flex: 1;
      min-height: 220px;
    }
    .chart-card .chart-box {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    .chart-legend-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 6px;
      padding: 4px 8px;
      background: var(--bg-tertiary);
      border-radius: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    .chart-zoom-hint {
      font-size: 11px;
      color: var(--text-secondary);
      margin-left: auto;
      user-select: none;
    }
    .chart-zoom-status {
      font-size: 11px;
      color: var(--accent-blue);
      font-family: 'Consolas', monospace;
      user-select: none;
    }
    .log-area {
      flex: 1;
      min-height: 80px;
      font-size: 11px;
    }
    .empty-hint {
      color: var(--text-secondary);
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <!-- 工具栏 -->
    <div class="card" style="margin-bottom: 0;">
      <div class="toolbar">
        <button id="listBtn" class="btn btn-secondary">列出条目</button>
        <select id="entrySelect" title="选择要导出的条目">
          <option value="">(设备当前选中条目)</option>
        </select>
        <button id="exportBtn" class="btn btn-success">导出并查看</button>
        <button id="eraseBtn" class="btn btn-danger">清除全部</button>
        <span style="width: 1px; height: 22px; background: var(--border-color); margin: 0 4px;"></span>
        <button id="recStartBtn" class="btn btn-success">开始记录</button>
        <button id="recStopBtn" class="btn btn-warning">停止记录</button>
        <select id="intervalSelect" title="离线记录间隔">
          <option value="1" selected>间隔: 1s</option>
          <option value="5">间隔: 5s</option>
          <option value="10">间隔: 10s</option>
          <option value="30">间隔: 30s</option>
          <option value="60">间隔: 60s</option>
        </select>
        <button id="setIntervalBtn" class="btn btn-secondary">设置间隔</button>
        <select id="enableSelect" title="离线数据功能开关">
          <option value="1" selected>功能: 开</option>
          <option value="0">功能: 关</option>
        </select>
        <button id="setEnableBtn" class="btn btn-secondary">设置开关</button>
        <span class="spacer"></span>
        <button id="clearBtn" class="btn btn-warning">清空显示</button>
        <button id="saveBtn" class="btn btn-secondary">保存 CSV</button>
        <span class="status-text" id="statusLabel">状态: 待机</span>
      </div>
    </div>

    <div class="offline-main">
      <!-- 左侧: 条目列表 + 串口日志 -->
      <div class="left-panel">
        <div class="card">
          <div class="card-header">设备离线条目</div>
          <ul class="entry-list" id="entryList">
            <li class="empty-hint">点击「列出条目」获取设备存储</li>
          </ul>
        </div>
        <div class="card">
          <div class="card-header">串口日志</div>
          <div class="log-area" id="logArea"></div>
        </div>
      </div>

      <!-- 右侧: 统计 + 表格 + 曲线 -->
      <div class="right-panel">
        <div class="card" style="flex: none;">
          <div class="card-header">统计信息</div>
          <div class="export-progress" id="exportProgressWrap" hidden>
            <span class="export-progress-label" id="exportProgressLabel">导出中</span>
            <div class="export-progress-track">
              <div class="export-progress-fill" id="exportProgressFill"></div>
            </div>
            <span class="export-progress-pct" id="exportProgressPct"></span>
          </div>
          <div class="summary-grid">
            <div class="summary-item"><div class="label">记录数</div><div class="value" id="sumCount">0</div></div>
            <div class="summary-item"><div class="label">电压均值</div><div class="value" id="sumVoltAvg">--</div></div>
            <div class="summary-item"><div class="label">电压最大</div><div class="value" id="sumVoltMax">--</div></div>
            <div class="summary-item"><div class="label">电流最大</div><div class="value" id="sumCurMax">--</div></div>
            <div class="summary-item"><div class="label">功率最大</div><div class="value" id="sumPowMax">--</div></div>
            <div class="summary-item"><div class="label">能量(mWh)</div><div class="value" id="sumEnergy">--</div></div>
            <div class="summary-item"><div class="label">容量(mAh)</div><div class="value" id="sumCharge">--</div></div>
            <div class="summary-item"><div class="label">时长</div><div class="value" id="sumDuration">--</div></div>
          </div>
        </div>

        <div class="card chart-card">
          <div class="card-header">曲线预览</div>
          <div class="chart-legend-row">
            <label class="legend-item"><span class="legend-color" style="background:#3ddc84"></span>电压 (V)<input type="checkbox" id="showVoltCheck" checked></label>
            <label class="legend-item"><span class="legend-color" style="background:#ff69b4"></span>电流 (A)<input type="checkbox" id="showCurrCheck" checked></label>
            <label class="legend-item"><span class="legend-color" style="background:#ff9800"></span>功率 (W)<input type="checkbox" id="showPowCheck" checked></label>
            <label class="legend-item"><span class="legend-color" style="background:#9932cc"></span>温度 (°C)<input type="checkbox" id="showTempCheck"></label>
            <label class="legend-item"><span class="legend-color" style="background:#00bfff"></span>mAh<input type="checkbox" id="showMahCheck"></label>
            <label class="legend-item"><span class="legend-color" style="background:#ff6347"></span>mWh<input type="checkbox" id="showMwhCheck"></label>
            <span class="chart-zoom-hint">滚轮缩放 · 拖拽平移 · Shift+拖拽框选 · 双击/右键重置</span>
            <span class="chart-zoom-status" id="zoomStatusText"></span>
          </div>
          <div class="chart-box"><canvas id="chart"></canvas></div>
        </div>

        <div class="card" style="flex: none; height: 240px;">
          <div class="card-header">记录数据</div>
          <div class="table-wrap" id="tableWrap">
            <table>
              <thead>
                <tr>
                  <th style="text-align:left;">序号</th>
                  <th>时间(s)</th>
                  <th>电压(V)</th>
                  <th>电流(A)</th>
                  <th>功率(W)</th>
                  <th>ADC温度(°C)</th>
                  <th>CPU温度(°C)</th>
                  <th>能量(mWh)</th>
                  <th>容量(mAh)</th>
                  <th style="text-align:left;">方向</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr><td colspan="10" class="empty-hint">暂无数据，点击「导出并查看」加载离线条目</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============ 离线数据查看逻辑 ============

    // 固件 Storage_Record / Storage_FileHeader 结构尺寸 (pack(1))
    const RECORD_SIZE = 47   // magic1 + seq4 + ts8 + 8*float32 + dir1 + checksum1
    const HEADER_SIZE = 8    // magic0/1 + version + record_size + reserved4

    Chart.defaults.font.family = "'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"

    // 状态
    const entries = []      // { index, path, bytes, records }
    const records = []      // 导出得到的记录
    let exporting = false
    let exportStartUs = null
    let firstRecordUs = null

    // 曲线渲染序列 (相对秒 + 各指标)，导出完成后构建，供像素级抽稀使用
    const series = { t: [], v: [], c: [], p: [], temp: [], mah: [], mwh: [] }
    // 表格虚拟滚动：只渲染可视行，固定行高
    const ROW_H = 24
    const TABLE_OVERSCAN = 10
    let tableRenderScheduled = false
    // 导出进度条：当前导出量 / 总数据量
    let exportTotalCount = null

    // DOM
    const elements = {
      listBtn: document.getElementById('listBtn'),
      entrySelect: document.getElementById('entrySelect'),
      exportBtn: document.getElementById('exportBtn'),
      eraseBtn: document.getElementById('eraseBtn'),
      clearBtn: document.getElementById('clearBtn'),
      saveBtn: document.getElementById('saveBtn'),
      recStartBtn: document.getElementById('recStartBtn'),
      recStopBtn: document.getElementById('recStopBtn'),
      intervalSelect: document.getElementById('intervalSelect'),
      setIntervalBtn: document.getElementById('setIntervalBtn'),
      enableSelect: document.getElementById('enableSelect'),
      setEnableBtn: document.getElementById('setEnableBtn'),
      statusLabel: document.getElementById('statusLabel'),
      entryList: document.getElementById('entryList'),
      logArea: document.getElementById('logArea'),
      sumCount: document.getElementById('sumCount'),
      sumVoltAvg: document.getElementById('sumVoltAvg'),
      sumVoltMax: document.getElementById('sumVoltMax'),
      sumCurMax: document.getElementById('sumCurMax'),
      sumPowMax: document.getElementById('sumPowMax'),
      sumEnergy: document.getElementById('sumEnergy'),
      sumCharge: document.getElementById('sumCharge'),
      sumDuration: document.getElementById('sumDuration'),
      tableWrap: document.getElementById('tableWrap'),
      tableBody: document.getElementById('tableBody')
    }

    // ============ 日志 ============
    function appendLog(text, type = 'recv') {
      const timestamp = new Date().toLocaleTimeString()
      const line = `[${timestamp}] ${text}`
      const logLine = document.createElement('div')
      logLine.className = `log-line log-${type}`
      logLine.textContent = line
      elements.logArea.appendChild(logLine)
      elements.logArea.scrollTop = elements.logArea.scrollHeight
    }

    function setStatus(text) {
      elements.statusLabel.textContent = `状态: ${text}`
    }

    // ============ 导出进度条 ============
    function showExportProgress(total) {
      exportTotalCount = total
      const wrap = document.getElementById('exportProgressWrap')
      if (wrap) wrap.hidden = false
      applyExportProgress(0, total)
    }

    function applyExportProgress(done, total) {
      const fill = document.getElementById('exportProgressFill')
      const pct = document.getElementById('exportProgressPct')
      const label = document.getElementById('exportProgressLabel')
      if (!fill) return
      if (total && total > 0) {
        const p = Math.min(100, Math.round(done / total * 100))
        fill.classList.remove('indeterminate')
        fill.style.width = p + '%'
        pct.textContent = p + '%'
        label.textContent = `导出中 ${done}/${total}`
      } else {
        fill.classList.add('indeterminate')
        fill.style.width = '40%'
        pct.textContent = ''
        label.textContent = `导出中 ${done} 条`
      }
    }

    function hideExportProgress() {
      exportTotalCount = null
      const wrap = document.getElementById('exportProgressWrap')
      if (wrap) wrap.hidden = true
    }

    // ============ 条目列表解析 ============
    function parseListLine(line) {
      // 形如: "  m0001.dat  1234 bytes" 或 "  /m0001.dat  1234 bytes"
      const match = line.match(/^\s*\/?m(\d+)\.dat\s+(\d+)\s+bytes/)
      if (!match) return null
      const index = parseInt(match[1], 10)
      const bytes = parseInt(match[2], 10)
      const recordsCount = bytes > HEADER_SIZE ? Math.floor((bytes - HEADER_SIZE) / RECORD_SIZE) : 0
      return { index, path: `/m${String(index).padStart(4, '0')}.dat`, bytes, records: recordsCount }
    }

    function renderEntries() {
      elements.entryList.innerHTML = ''
      elements.entrySelect.innerHTML = '<option value="">(设备当前选中条目)</option>'

      if (entries.length === 0) {
        const li = document.createElement('li')
        li.className = 'empty-hint'
        li.textContent = '(无条目)'
        elements.entryList.appendChild(li)
        return
      }

      entries.forEach(entry => {
        const li = document.createElement('li')
        const left = document.createElement('span')
        left.textContent = `#${entry.index} ${entry.path}`
        const meta = document.createElement('span')
        meta.className = 'entry-meta'
        meta.textContent = `${entry.records} 条 · ${entry.bytes} B`
        li.appendChild(left)
        li.appendChild(meta)
        li.dataset.index = entry.index
        li.addEventListener('click', () => {
          elements.entrySelect.value = String(entry.index)
          highlightSelected()
        })
        li.addEventListener('dblclick', () => {
          elements.entrySelect.value = String(entry.index)
          highlightSelected()
          exportSelected()
        })
        elements.entryList.appendChild(li)

        const opt = document.createElement('option')
        opt.value = String(entry.index)
        opt.textContent = `#${entry.index} (${entry.records} 条)`
        elements.entrySelect.appendChild(opt)
      })
      highlightSelected()
    }

    function highlightSelected() {
      const sel = elements.entrySelect.value
      Array.from(elements.entryList.children).forEach(li => {
        li.classList.toggle('selected', li.dataset.index === sel)
      })
    }

    // ============ 表格 / 图表 / 统计 ============
    function fmtTime(sec) {
      if (sec < 60) return `${sec.toFixed(1)}s`
      if (sec < 3600) return `${Math.floor(sec / 60)}m${Math.floor(sec % 60)}s`
      return `${Math.floor(sec / 3600)}h${Math.floor((sec % 3600) / 60)}m`
    }

    function rowHtml(rec, idx) {
      const relSec = firstRecordUs != null ? (rec.espTimeUs - firstRecordUs) / 1000000 : 0
      const dirText = rec.currentDirection ? '← 左' : '→ 右'
      const bg = idx % 2 === 0 ? ' style="background:rgba(128,128,128,0.05)"' : ''
      return '<tr' + bg + '>' +
        `<td>${idx}</td>` +
        `<td>${relSec.toFixed(3)}</td>` +
        `<td>${rec.voltage.toFixed(4)}</td>` +
        `<td>${rec.current.toFixed(4)}</td>` +
        `<td>${rec.power.toFixed(4)}</td>` +
        `<td>${rec.temperatureAdc.toFixed(2)}</td>` +
        `<td>${rec.temperatureCpu.toFixed(2)}</td>` +
        `<td>${rec.energyMWh.toFixed(2)}</td>` +
        `<td>${rec.chargeMAh.toFixed(2)}</td>` +
        `<td style="text-align:left;">${dirText}</td>` +
        '</tr>'
    }

    function spacerRow(h) {
      return `<tr style="height:${h}px;background:transparent;"><td colspan="10" style="height:${h}px;padding:0;border:0;"></td></tr>`
    }

    // 虚拟滚动：仅渲染可视区间的行，上下用空行撑起滚动条
    function renderTableVirtual() {
      const n = records.length
      if (n === 0) {
        elements.tableBody.innerHTML = '<tr><td colspan="10" class="empty-hint">暂无数据，点击「导出并查看」加载离线条目</td></tr>'
        return
      }

      const wrap = elements.tableWrap
      const thead = wrap.querySelector('thead')
      const theadH = thead ? thead.offsetHeight : 0
      const viewH = wrap.clientHeight || 240
      const scrollTop = wrap.scrollTop

      const start = Math.max(0, Math.floor((scrollTop - theadH) / ROW_H) - TABLE_OVERSCAN)
      const visibleCount = Math.ceil(viewH / ROW_H) + TABLE_OVERSCAN * 2
      const end = Math.min(n, start + visibleCount)

      let html = spacerRow(start * ROW_H)
      for (let i = start; i < end; i++) {
        html += rowHtml(records[i], i + 1)
      }
      html += spacerRow((n - end) * ROW_H)
      elements.tableBody.innerHTML = html
    }

    function scheduleTableRender() {
      if (tableRenderScheduled) return
      tableRenderScheduled = true
      requestAnimationFrame(() => {
        tableRenderScheduled = false
        renderTableVirtual()
      })
    }

    function updateSummary() {
      const n = records.length
      elements.sumCount.textContent = String(n)
      if (n === 0) {
        elements.sumVoltAvg.textContent = '--'
        elements.sumVoltMax.textContent = '--'
        elements.sumCurMax.textContent = '--'
        elements.sumPowMax.textContent = '--'
        elements.sumEnergy.textContent = '--'
        elements.sumCharge.textContent = '--'
        elements.sumDuration.textContent = '--'
        return
      }
      let vSum = 0, vMax = -Infinity, cMax = -Infinity, pMax = -Infinity
      records.forEach(r => {
        vSum += r.voltage
        if (r.voltage > vMax) vMax = r.voltage
        if (Math.abs(r.current) > cMax) cMax = Math.abs(r.current)
        if (Math.abs(r.power) > pMax) pMax = Math.abs(r.power)
      })
      elements.sumVoltAvg.textContent = (vSum / n).toFixed(4) + ' V'
      elements.sumVoltMax.textContent = vMax.toFixed(4) + ' V'
      elements.sumCurMax.textContent = cMax.toFixed(4) + ' A'
      elements.sumPowMax.textContent = pMax.toFixed(4) + ' W'
      elements.sumEnergy.textContent = records[records.length - 1].energyMWh.toFixed(2) + ' mWh'
      elements.sumCharge.textContent = records[records.length - 1].chargeMAh.toFixed(2) + ' mAh'
      const duration = (records[records.length - 1].espTimeUs - records[0].espTimeUs) / 1000000
      elements.sumDuration.textContent = fmtTime(duration)
    }

    // ========== 抽稀与缩放辅助 ==========
    function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi) }

    function getDataBounds() {
      if (series.t.length === 0) return { dataMin: 0, dataMax: 10, totalRange: 10 }
      const dMin = series.t[0]
      const dMax = series.t[series.t.length - 1]
      return { dataMin: dMin, dataMax: dMax, totalRange: Math.max(0.1, dMax - dMin) }
    }

    function buildSeries() {
      const n = records.length
      series.t.length = n
      series.v.length = n
      series.c.length = n
      series.p.length = n
      series.temp.length = n
      series.mah.length = n
      series.mwh.length = n
      for (let i = 0; i < n; i++) {
        const r = records[i]
        const t = firstRecordUs != null ? (r.espTimeUs - firstRecordUs) / 1000000 : 0
        series.t[i] = t
        series.v[i] = r.voltage
        series.c[i] = r.current
        series.p[i] = r.power
        series.temp[i] = r.temperatureAdc
        series.mah[i] = r.chargeMAh
        series.mwh[i] = r.energyMWh
      }
    }

    function ensureSeries() {
      if (series.t.length !== records.length) buildSeries()
    }

    // 像素级极值抽稀：按可视区间与画布像素宽度分桶，返回每桶 {x, y(均值), yMin, yMax}
    function decimateLine(timeArr, valArr, xMin, xMax, pixelWidth) {
      if (!timeArr || timeArr.length === 0) return []
      const range = Math.max(1e-9, xMax - xMin)
      const binCount = Math.max(1, Math.min(pixelWidth, 4000))
      const binWidth = range / binCount
      const sum = new Float64Array(binCount)
      const cnt = new Uint32Array(binCount)
      const mn = new Float64Array(binCount).fill(Infinity)
      const mx = new Float64Array(binCount).fill(-Infinity)

      for (let i = 0; i < timeArr.length; i++) {
        const t = timeArr[i]
        if (t < xMin || t > xMax) continue
        const v = valArr[i]
        if (!Number.isFinite(v)) continue
        let b = Math.floor((t - xMin) / binWidth)
        if (b < 0) b = 0
        else if (b >= binCount) b = binCount - 1
        sum[b] += v
        cnt[b]++
        if (v < mn[b]) mn[b] = v
        if (v > mx[b]) mx[b] = v
      }

      const result = []
      for (let b = 0; b < binCount; b++) {
        if (cnt[b] > 0) {
          result.push({ x: xMin + (b + 0.5) * binWidth, y: sum[b] / cnt[b], yMin: mn[b], yMax: mx[b] })
        }
      }
      return result
    }

    // 框选放大选区绘制插件
    const selectionRectPlugin = {
      id: 'selectionRectPlugin',
      afterDraw(chart, args, options) {
        if (!options || !options.active || options.x1 == null) return
        const ctx = chart.ctx
        const x1 = Math.min(options.x1, options.x2)
        const y1 = Math.min(options.y1, options.y2)
        const x2 = Math.max(options.x1, options.x2)
        const y2 = Math.max(options.y1, options.y2)
        const w = x2 - x1
        const h = y2 - y1
        if (w < 3 && h < 3) return
        ctx.save()
        ctx.fillStyle = 'rgba(0, 217, 255, 0.10)'
        ctx.fillRect(x1, y1, w, h)
        ctx.strokeStyle = 'rgba(0, 217, 255, 0.60)'
        ctx.lineWidth = 1.5
        ctx.setLineDash([5, 3])
        ctx.strokeRect(x1, y1, w, h)
        ctx.restore()
      }
    }

    // 曲线 (相对秒 → 电压/电流/功率)
    const chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        datasets: [
          { label: '电压 (V)', data: [], borderColor: '#3ddc84', backgroundColor: '#3ddc84', pointBackgroundColor: '#3ddc84', pointBorderColor: '#3ddc84', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2, yAxisID: 'y' },
          { label: '电流 (A)', data: [], borderColor: '#ff69b4', backgroundColor: '#ff69b4', pointBackgroundColor: '#ff69b4', pointBorderColor: '#ff69b4', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2, yAxisID: 'y1' },
          { label: '功率 (W)', data: [], borderColor: '#ff9800', backgroundColor: '#ff9800', pointBackgroundColor: '#ff9800', pointBorderColor: '#ff9800', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2, yAxisID: 'y2' },
          { label: '温度 (°C)', data: [], borderColor: '#9932cc', backgroundColor: '#9932cc', pointBackgroundColor: '#9932cc', pointBorderColor: '#9932cc', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2, yAxisID: 'y3', hidden: true },
          { label: 'mAh', data: [], borderColor: '#00bfff', backgroundColor: '#00bfff', pointBackgroundColor: '#00bfff', pointBorderColor: '#00bfff', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2, yAxisID: 'y4', hidden: true },
          { label: 'mWh', data: [], borderColor: '#ff6347', backgroundColor: '#ff6347', pointBackgroundColor: '#ff6347', pointBorderColor: '#ff6347', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2, yAxisID: 'y5', hidden: true }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        parsing: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },

          y2: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '功率 (W)' } },

          y5: { type: 'linear', display: false, position: 'right', title: { display: true, text: 'mWh' }, grid: { drawOnChartArea: false } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a2e',
            titleColor: '#00d9ff',
            bodyColor: '#eaeaea',
            borderColor: '#0066CC',
            borderWidth: 1,
            callbacks: {
              title: function (context) {
                return 'Time(s):' + context[0].parsed.x.toFixed(3)
              }

          }

      },

    })

    chart.options.plugins.selectionRectPlugin = { active: false }

    function renderChart() {
      const n = records.length
      if (n === 0) {
        for (let i = 0; i < chart.data.datasets.length; i++) chart.data.datasets[i].data = []
        chart.update('none')
        updateZoomStatus()
        return
      }

      ensureSeries()
      const dataMin = series.t[0]
      const dataMax = series.t[n - 1]

      // 可视区间：优先用户缩放/平移后的 X 轴范围，否则全量
      const xo = chart.options.scales.x
      let xMin = (xo.min != null) ? xo.min : dataMin
      let xMax = (xo.max != null) ? xo.max : dataMax
      if (!(xMax > xMin)) { xMin = dataMin; xMax = dataMax }
      xMin = Math.max(dataMin, xMin)
      xMax = Math.min(dataMax, xMax)
      if (xMax - xMin < 1e-9) { xMin = dataMin; xMax = dataMax }

      const pixelW = Math.max(1, chart.chartArea ? chart.chartArea.width : (chart.canvas.clientWidth || 800))
      const binCount = Math.max(1, Math.min(Math.floor(pixelW), 4000))

      const fields = [
        { arr: series.v, idx: 0, axis: 'y' },
        { arr: series.c, idx: 1, axis: 'y1' },
        { arr: series.p, idx: 2, axis: 'y2' },
        { arr: series.temp, idx: 3, axis: null },
        { arr: series.mah, idx: 4, axis: null },
        { arr: series.mwh, idx: 5, axis: null }
      ]

      const yExtents = { y: { min: Infinity, max: -Infinity }, y1: { min: Infinity, max: -Infinity }, y2: { min: Infinity, max: -Infinity } }

      fields.forEach(f => {
        const dec = decimateLine(series.t, f.arr, xMin, xMax, binCount)
        chart.data.datasets[f.idx].data = dec.map(d => ({ x: d.x, y: d.y }))
        if (f.axis) {
          dec.forEach(d => {
            if (d.yMin < yExtents[f.axis].min) yExtents[f.axis].min = d.yMin
            if (d.yMax > yExtents[f.axis].max) yExtents[f.axis].max = d.yMax
          })
        }
      })

      // Y 轴基于可视区间极值(含 padding)，保证峰值不被裁剪
      Object.keys(yExtents).forEach(id => {
        const e = yExtents[id]
        if (e.max > e.min) {
          const range = e.max - e.min
          const pad = range * 0.08 || 0.01
          chart.options.scales[id].min = e.min - pad
          chart.options.scales[id].max = e.max + pad
        } else {
          chart.options.scales[id].min = undefined
          chart.options.scales[id].max = undefined
        }
      })

      chart.options.scales.x.min = xMin
      chart.options.scales.x.max = xMax
      chart.update('none')
      updateZoomStatus()
    }

    function updateZoomStatus() {
      const el = document.getElementById('zoomStatusText')
      if (!el) return
      if (records.length === 0) { el.textContent = ''; return }
      const dataMin = series.t[0]
      const dataMax = series.t[series.t.length - 1]
      const xo = chart.options.scales.x
      const vMin = xo.min != null ? xo.min : dataMin
      const vMax = xo.max != null ? xo.max : dataMax
      const win = vMax - vMin
      const total = dataMax - dataMin
      const pct = total > 0 ? (win / total * 100) : 100
      el.textContent = `可视 ${vMin.toFixed(1)}~${vMax.toFixed(1)}s · ${win.toFixed(2)}s · ${pct.toFixed(0)}%`
    }

    // ========== 缩放 / 平移 / 框选 / 重置 ==========
    const ZOOM_FACTOR = 1.15
    const MIN_X_RANGE = 0.05

    function zoomAtCursor(deltaY, clientX) {
      if (records.length === 0) return
      ensureSeries()
      const rect = chart.canvas.getBoundingClientRect()
      const px = clientX - rect.left
      const xs = chart.scales.x
      let t = null
      if (xs) t = xs.getValueForPixel(px)

      const { dataMin, dataMax, totalRange } = getDataBounds()
      const xo = chart.options.scales.x
      const curMin = xo.min != null ? xo.min : dataMin
      const curMax = xo.max != null ? xo.max : dataMax
      const xRange = Math.max(1e-9, curMax - curMin)
      const center = (t != null && Number.isFinite(t)) ? t : (curMin + curMax) / 2

      const factor = deltaY < 0 ? 1 / ZOOM_FACTOR : ZOOM_FACTOR
      const newRange = clamp(xRange * factor, Math.min(MIN_X_RANGE, totalRange), Math.max(totalRange, MIN_X_RANGE))
      const ratio = clamp((center - curMin) / xRange, 0, 1)
      let newMin = center - newRange * ratio
      let newMax = center + newRange * (1 - ratio)
      if (newMin < dataMin) { newMin = dataMin; newMax = dataMin + newRange }
      if (newMax > dataMax) { newMax = dataMax; newMin = dataMax - newRange }
      newMin = Math.max(dataMin, newMin)
      newMax = Math.min(dataMax, newMax)

      chart.options.scales.x.min = newMin
      chart.options.scales.x.max = newMax
      renderChart()
    }

    function registerWheelZoom() {
      chart.canvas.addEventListener('wheel', (evt) => {
        if (records.length === 0) { evt.preventDefault(); return }
        evt.preventDefault()
        zoomAtCursor(evt.deltaY, evt.clientX)
      }, { passive: false })
    }

    function registerPan() {
      let isPanning = false
      let startX = 0, startMin = 0, startMax = 0

      chart.canvas.addEventListener('mousedown', (evt) => {
        if (evt.button !== 0) return
        if (evt.shiftKey || evt.ctrlKey) return
        const rect = chart.canvas.getBoundingClientRect()
        if (evt.clientX < rect.left || evt.clientX > rect.right) return
        if (evt.clientY < rect.top || evt.clientY > rect.bottom) return
        isPanning = true
        startX = evt.clientX
        ensureSeries()
        const b = getDataBounds()
        const xo = chart.options.scales.x
        startMin = xo.min != null ? xo.min : b.dataMin
        startMax = xo.max != null ? xo.max : b.dataMax
        chart.canvas.style.cursor = 'grabbing'
      })

      document.addEventListener('mousemove', (evt) => {
        if (!isPanning) return
        evt.preventDefault()
        const rect = chart.canvas.getBoundingClientRect()
        const chartW = rect.right - rect.left
        if (chartW <= 0) return
        const { dataMin, dataMax } = getDataBounds()
        const xRange = Math.max(1e-9, startMax - startMin)
        const pxPerUnit = chartW / xRange
        const dx = (startX - evt.clientX) / pxPerUnit
        let newMin = startMin + dx
        let newMax = startMax + dx
        if (newMin < dataMin) { newMin = dataMin; newMax = dataMin + xRange }
        if (newMax > dataMax) { newMax = dataMax; newMin = dataMax - xRange }
        chart.options.scales.x.min = newMin
        chart.options.scales.x.max = newMax
        renderChart()
      })

      document.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false
          chart.canvas.style.cursor = ''
        }
      })
    }

    function registerSelectionZoom() {
      let isSelecting = false
      let sx = 0, sy = 0, cx = 0, cy = 0

      chart.canvas.addEventListener('mousedown', (evt) => {
        if (evt.button !== 0) return
        const rect = chart.canvas.getBoundingClientRect()
        if (evt.clientX < rect.left || evt.clientX > rect.right) return
        if (evt.clientY < rect.top || evt.clientY > rect.bottom) return
        if (records.length === 0) return
        if (!evt.shiftKey && !evt.ctrlKey) return

        isSelecting = true
        sx = evt.clientX - rect.left
        sy = evt.clientY - rect.top
        cx = sx
        cy = sy
        chart.options.plugins.selectionRectPlugin = { active: true, x1: sx, y1: sy, x2: cx, y2: cy }
        chart.update('none')
      })

      document.addEventListener('mousemove', (evt) => {
        if (!isSelecting) return
        const rect = chart.canvas.getBoundingClientRect()
        cx = evt.clientX - rect.left
        cy = evt.clientY - rect.top
        chart.options.plugins.selectionRectPlugin = { active: true, x1: sx, y1: sy, x2: cx, y2: cy }
        chart.update('none')
      })

      document.addEventListener('mouseup', (evt) => {
        if (!isSelecting) return
        isSelecting = false

        const rect = chart.canvas.getBoundingClientRect()
        const ex = evt.clientX - rect.left
        const ey = evt.clientY - rect.top
        const dx = Math.abs(ex - sx)
        const dy = Math.abs(ey - sy)

        chart.options.plugins.selectionRectPlugin = { active: false }
        if (dx < 5 && dy < 5) {
          chart.update('none')
          return
        }

        const xs = chart.scales.x
        const t1 = xs ? xs.getValueForPixel(Math.min(sx, ex)) : null
        const t2 = xs ? xs.getValueForPixel(Math.max(sx, ex)) : null
        if (t1 == null || t2 == null) {
          chart.update('none')
          return
        }

        ensureSeries()
        const { dataMin, dataMax } = getDataBounds()
        let newMin = clamp(t1, dataMin, dataMax)
        let newMax = clamp(t2, dataMin, dataMax)
        if (newMax - newMin < MIN_X_RANGE) {
          const mid = (newMin + newMax) / 2
          newMin = Math.max(dataMin, mid - MIN_X_RANGE / 2)
          newMax = Math.min(dataMax, mid + MIN_X_RANGE / 2)
        }

        chart.options.scales.x.min = newMin
        chart.options.scales.x.max = newMax
        renderChart()
      })
    }

    function resetViewFull() {
      chart.options.scales.x.min = undefined
      chart.options.scales.x.max = undefined
      ;['y', 'y1', 'y2', 'y3', 'y4', 'y5'].forEach(id => {
        chart.options.scales[id].min = undefined
        chart.options.scales[id].max = undefined
      })
      renderChart()
    }

    function registerReset() {
      chart.canvas.addEventListener('dblclick', resetViewFull)
      chart.canvas.addEventListener('contextmenu', (evt) => {

        resetViewFull()

      series.p.length = 0
      series.temp.length = 0
      series.mah.length = 0
      series.mwh.length = 0

      chart.options.scales.x.max = undefined

    // ============ 操作 ============
    async function ensurePortOpen() {
      const open = await window.electronAPI.isPortOpen()
      if (!open) {
        alert('请先在主界面打开串口！')
        return false
      }
      return true
    }

    async function listEntries() {
      if (!await ensurePortOpen()) return
      // 清空旧列表，重新从设备拉取，避免已删除的条目残留
      entries.length = 0
      renderEntries()
      appendLog('发送: export:list', 'send')
      const res = await window.electronAPI.offlineList()
      if (!res.success) {
        appendLog(`列出失败: ${res.error}`, 'error')
        alert(`列出条目失败: ${res.error}`)
      }
    }

    async function exportSelected() {
      if (!await ensurePortOpen()) return
      if (exporting) return

      const index = parseInt(elements.entrySelect.value, 10) || 0
      clearDisplay()
      exporting = true
      firstRecordUs = null
      elements.exportBtn.disabled = true
      setStatus(`导出中 (${index > 0 ? '#' + index : '当前选中条目'})...`)
      appendLog(`发送: ${index > 0 ? 'export:' + index : 'export'}`, 'send')
      showExportProgress(null)  // 先显示不定进度，等待 EXPORT 标记给出总量

      const res = await window.electronAPI.offlineExport(index)
      if (!res.success) {
        exporting = false
        elements.exportBtn.disabled = false
        setStatus('导出失败')
        appendLog(`导出失败: ${res.error}`, 'error')
        hideExportProgress()
        alert(`导出失败: ${res.error}`)
      }
    }

    async function eraseAll() {
      if (!await ensurePortOpen()) return
      if (!confirm('确定要清除设备上的全部离线条目吗？此操作不可恢复！')) return
      appendLog('发送: export:erase', 'send')
      const res = await window.electronAPI.offlineErase()
      if (!res.success) {
        appendLog(`清除失败: ${res.error}`, 'error')
        alert(`清除失败: ${res.error}`)
      } else {
        // 清除命令已发送，但不能假定设备已擦除完成；
        // 清空本地条目列表与数据展示（表格/统计/曲线）后重新查询设备真实条目列表。
        entries.length = 0
        renderEntries()
        clearDisplay()
        appendLog('清除命令已发送，重新查询设备条目列表...', 'system')
        setTimeout(listEntries, 500)
      }
    }

    async function saveCSV() {
      if (records.length === 0) {
        alert('没有数据可保存！')
        return
      }
      const now = new Date()
      const defaultName = `offline_data_${now.getFullYear()}${(now.getMonth() + 1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}${now.getSeconds().toString().padStart(2, '0')}.csv`

      const result = await window.electronAPI.saveDialog(defaultName, [
        { name: 'CSV Files', extensions: ['csv'] },
        { name: 'All Files', extensions: ['*'] }
      ])

      if (result.filePath) {
        let csv = '序号,时间(秒),时间戳(us),电压(V),电流(A),功率(W),ADC温度(°C),CPU温度(°C),能量(mWh),容量(mAh),方向\n'
        records.forEach((r, i) => {
          const relSec = firstRecordUs != null ? (r.espTimeUs - firstRecordUs) / 1000000 : 0
          csv += `${i + 1},${relSec.toFixed(3)},${r.espTimeUs},`
          csv += `${r.voltage.toFixed(4)},${r.current.toFixed(4)},${r.power.toFixed(4)},`
          csv += `${r.temperatureAdc.toFixed(2)},${r.temperatureCpu.toFixed(2)},${r.energyMWh.toFixed(2)},${r.chargeMAh.toFixed(2)},${r.currentDirection ? '左' : '右'}\n`
        })
        const saveResult = await window.electronAPI.saveLogFile(result.filePath, '\ufeff' + csv)
        if (saveResult.success) {
          alert(`数据已保存至:\n${result.filePath}`)
        } else {
          alert(`保存失败: ${saveResult.error}`)
        }
      }
    }

    elements.saveBtn.addEventListener('click', saveCSV)
    elements.recStartBtn.addEventListener('click', startRecording)
    elements.recStopBtn.addEventListener('click', stopRecording)
    elements.setIntervalBtn.addEventListener('click', setRecordInterval)
    elements.setEnableBtn.addEventListener('click', setRecordEnable)
    elements.entrySelect.addEventListener('change', highlightSelected)
    document.getElementById('showVoltCheck').addEventListener('change', (e) => toggleDataset(0, e.target.checked))
    document.getElementById('showCurrCheck').addEventListener('change', (e) => toggleDataset(1, e.target.checked))
    document.getElementById('showPowCheck').addEventListener('change', (e) => toggleDataset(2, e.target.checked))
    document.getElementById('showTempCheck').addEventListener('change', (e) => toggleDataset(3, e.target.checked))
    document.getElementById('showMahCheck').addEventListener('change', (e) => toggleDataset(4, e.target.checked))
    document.getElementById('showMwhCheck').addEventListener('change', (e) => toggleDataset(5, e.target.checked))

    // 曲线交互：滚轮缩放 + 拖拽平移 + 框选放大 + 双击/右键重置
    registerWheelZoom()
    registerPan()
    registerSelectionZoom()
    registerReset()

    // 表格虚拟滚动
    elements.tableWrap.addEventListener('scroll', scheduleTableRender)

    // 串口文本 (日志 + 条目列表)
    window.electronAPI.onSerialData((line) => {
      appendLog(`接收: ${line}`)
      const entry = parseListLine(line)
      if (entry) {
        const existing = entries.find(e => e.index === entry.index)
        if (existing) {
          existing.bytes = entry.bytes
          existing.records = entry.records
        } else {
          entries.push(entry)
        }
        renderEntries()
      }
    })

    // 离线导出事件
    window.electronAPI.onOfflineExportStart((meta) => {
      setStatus(`导出中: ${meta.path} (${meta.count} 条)...`)
      appendLog(`开始导出: ${meta.path} · ${meta.count} 条 · ${meta.bytes} 字节`, 'system')
      showExportProgress(meta.count)
    })

    window.electronAPI.onOfflineExportRecord(({ record, index, total }) => {
      if (firstRecordUs == null) firstRecordUs = record.espTimeUs
      records.push(record)
      scheduleTableRender()
      applyExportProgress(index, (total && total > 0) ? total : exportTotalCount)
      // 每 100 条或最后一条更新一次状态，减少 DOM 文本刷新
      if (total ? (index % 100 === 1 || index === total) : (index % 100 === 1)) {
        setStatus(total ? `导出中: ${index}/${total}` : `导出中: ${index} 条`)
      }
    })

    window.electronAPI.onOfflineExportDone((summary) => {
      exporting = false
      elements.exportBtn.disabled = false
      setStatus(`完成: ${summary.count} 条`)
      appendLog(`导出完成: ${summary.count} 条`, 'system')
      renderTableVirtual()
      updateSummary()
      renderChart()
      applyExportProgress(summary.count, summary.count)  // 进度推到 100%
      setTimeout(hideExportProgress, 800)
    })

    window.electronAPI.onMenuOfflineSave(() => saveCSV())
    window.electronAPI.onMenuOfflineList(() => listEntries())

    // 主题
    async function initTheme() {
      const theme = await window.electronAPI.getTheme()
      applyTheme(theme)
    }
    function applyTheme(theme) {
      document.body.classList.remove('theme-light', 'theme-dark')
      document.body.classList.add(`theme-${theme}`)
    }
    window.electronAPI.onThemeChanged((theme) => applyTheme(theme))

    // 串口关闭时复位
    window.electronAPI.onSerialClosed(() => {
      exporting = false
      elements.exportBtn.disabled = false
      setStatus('串口已关闭')
    })

    // 初始化
    initTheme()
    ;(async () => {
      // 若串口已打开, 自动刷新条目列表
      try {
        const open = await window.electronAPI.isPortOpen()
        if (open) setTimeout(listEntries, 300)
      } catch (e) { /* ignore */ }
    })()
  </script>
</body>
</html>
